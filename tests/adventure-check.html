 for(const [width,height]of [[844,390],[390,844],[320,568]])await check(width+'×'+height+' 手机视角、按住攻击与多指',async()=>{await load(true,width,height);select('silver');arena();g.setView('first');const doc=win.document,c=doc.querySelector('#world'),a=doc.querySelector('#aim-stick'),j=doc.querySelector('#joystick');for(const q of [c,a,j])q.setPointerCapture=()=>{};const rects=[j,a,doc.querySelector('#dash')].map(q=>q.getBoundingClientRect());for(let i=0;i<rects.length;i++)for(let k=i+1;k<rects.length;k++){const r=rects[i],q=rects[k];assert(!(Math.min(r.right,q.right)>Math.max(r.left,q.left)&&Math.min(r.bottom,q.bottom)>Math.max(r.top,q.top)),'手机操作键重叠');}const y=g.adventureCamera.yaw;pointer(c,'pointerdown',{pointerType:'touch',pointerId:7,clientX:500});pointer(win,'pointermove',{pointerType:'touch',pointerId:7,clientX:560});assert(g.adventureCamera.yaw<y,'空白区域不能转向');pointer(j,'pointerdown',{pointerType:'touch',pointerId:8,clientX:j.getBoundingClientRect().x+40,clientY:j.getBoundingClientRect().y});pointer(a,'pointerdown',{pointerType:'touch',pointerId:9});assert(g.controls.held,'手机按下不攻击');pointer(a,'pointermove',{pointerType:'touch',pointerId:9,clientX:540});step(15);pointer(a,'pointerup',{pointerType:'touch',pointerId:9});assert(!g.controls.held,'松手仍攻击');pointer(j,'pointercancel',{pointerType:'touch',pointerId:8});pointer(win,'pointerup',{pointerType:'touch',pointerId:7});doc.querySelector('#view-toggle').click();step();assert(g.adventureCamera.mode==='third','手机视角按钮失败');const r=doc.querySelector('#view-toggle').getBoundingClientRect();assert(r.x>=0&&r.right<=width,'切换按钮超出屏幕');const f=reportFrame();assert(f.pixels<=1800000,'手机像素预算超限');g.pause();step(5);assert(g.state==='paused'&&!g.controls.held,'手机暂停清理失败');return f;});
 await check('全部浏览器日志',()=>{errors.push(...win.qaErrors);assert(!errors.length,errors.join('\n'));return{errors};});
 publish();$('#status').textContent=results.every(r=>r.pass)?'全部 '+results.length+' 项通过（手机为尺寸与触控模拟，非真机）':'存在失败，请查看报告';for(const b of document.querySelectorAll('button'))b.disabled=false;
};
async function preview(mode){await load();select(previewHero.value,Number(previewWeapon.value),$('#preview-map').value);g.setView(mode);g.adventureCamera.yaw=-.75;g.adventureCamera.pitch=mode==='first'?-.08:-.20;
 const place=$('#preview-place').value;
 if(place==='water'){const p=g.world.ponds[0];if(p){g.player.x=p.x+p.rx+2;g.player.z=p.z;g.adventureCamera.yaw=-Math.PI/2;g.adventureCamera.pitch=mode==='first'?-.23:-.32;}}
 if(place==='trees'){const trees=g.world.obstacles.filter(o=>o.mesh.getObjectByName('tree-canopy')),p=trees.find(o=>g.world.obstacles.every(q=>Math.hypot(o.x-q.x,o.z+5-q.z)>q.r+1));if(p){g.player.x=p.x;g.player.z=p.z+5;g.adventureCamera.yaw=Math.PI;g.adventureCamera.pitch=mode==='first'?.15:.05;}}
 step(30);$('#status').textContent=(mode==='first'?'第一人称':'第三人称')+' · '+previewHero.selectedOptions[0].text+' / '+previewWeapon.selectedOptions[0].text+' · '+$('#preview-map').selectedOptions[0].text+' · '+JSON.stringify(reportFrame())+' · 真实鼠标锁定需在游戏画面内点击验证；固定帧预览移动后点击保存即可刷新。';}
function reportAttackPreview(){assert(g.hero.userData.shotSerial===previewShot.serial,'回收预览意外触发第二次攻击');$('#status').textContent=WEAPONS[g.player.weaponId].name+' · 单次攻击第 '+previewShot.frames+' 帧（60 帧/秒；可反复推进回收） · '+JSON.stringify({attackAge:g.hero.userData.attackAge,reloadPhase:g.hero.userData.reloadPhase,weaponVisible:g.firstPerson.weapon.visible,...reportFrame()});}
$('#attack-preview').onclick=async()=>{const button=$('#attack-preview');button.disabled=true;try{await preview('first');win.document.querySelector('[data-attack-mode="manual"]').click();const serial=g.hero.userData.shotSerial||0;fire(1);step(3);assert(g.hero.userData.shotSerial===serial+1,'未触发恰好一次攻击');previewShot={serial:serial+1,frames:4};reportAttackPreview();}catch(e){$('#status').textContent='出手预览失败：'+e.message;}finally{button.disabled=false;}};
$('#recover-preview').onclick=()=>{if(!previewShot){$('#status').textContent='请先选择人物与武器，再点击「单次出手预览」。';return;}if(g.state==='paused')g.resume();step(8);previewShot.frames+=8;reportAttackPreview();};
$('#third').onclick=()=>preview('third');$('#first').onclick=()=>preview('first');$('#capture').onclick=()=>{step(1,0);const a=document.createElement('a');a.href=g.renderer.domElement.toDataURL('image/png');a.download='forest-next-'+g.player.weaponId+'-'+g.adventureCamera.mode+'-f'+(previewShot?.frames||0)+'.png';a.click();};
try{await load();$('#status').textContent='已就绪';for(const b of document.querySelectorAll('button'))b.disabled=false;}catch(e){$('#status').textContent=e.message;}
</script></html>
