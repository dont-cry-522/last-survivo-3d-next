  }
  if(safe)return{obstacle,yaw,start,dx,dz,distance,candidates:low.length};
 }
 return null;
}
function landOnActualObstacle(sample,hz=60){
 const {obstacle:o,start,yaw,dx,dz,distance}=sample;putObstaclePlayer(start.x,start.z,yaw);obstacleJump();key('keydown','w');
 for(let i=0;i<hz*1.3;i++){g.step(1/hz);if((g.player.x-start.x)*dx+(g.player.z-start.z)*dz>=distance-.07)break;}
 key('keyup','w');obstacleFrames(hz,1);assert(Math.hypot(g.player.x-o.x,g.player.z-o.z)<o.r+.4,'无法沿真实路径抵达矮物');assert(Math.abs(g.player.y-o.height)<.025&&Math.abs(g.player.groundHeight-o.height)<.025,'真实物件没有提供正确支撑');
 return{height:o.height,radius:o.r,kind:o.kind||o.mesh?.name||'world.obstacles',position:[o.x,o.z],footHeight:g.player.y,candidates:sample.candidates};
}

function edgeLayerReport(layer,label,map){
 assert(layer&&!layer.userData.disposed&&layer.parent===g.world.group,label+' 未实际安装');
 const records=layer.userData.records,edges=records.filter(p=>p.edge),batches=layer.children.filter(m=>m.isInstancedMesh);
 assert(edges.length>0&&edges.length<=Math.floor(records.length*.22),label+' 边缘重分配缺失或超22%预算');
 assert(batches.reduce((n,m)=>n+m.count,0)===records.length,label+' 实例与记录数量不一致');
 assert(layer.children.length<=(label==='地表'?10:16),label+' 合批超预算');
 for(const p of edges){
  const source=p.edge==='cluster'?g.world.environmentClusters.records[p.edgeIndex]:p.edge==='place'?g.world.biomePlaces[p.edgeIndex]:null;
  assert(source&&source.biome===p.biome,label+' 边缘记录未关联同地图真实场景');
  assert(Number.isFinite(p.x)&&Number.isFinite(p.z)&&Number.isFinite(p.color),label+' 边缘坐标或颜色无效');
  assert(!g.world.obstacles.some(o=>Math.hypot(p.x-o.x,p.z-o.z)<o.r+.1),label+' 边缘实例侵入实体');
 }
 if(label==='地表')assert(records.length<={forest:1200,snow:420,ash:380,sand:520,coast:920,confluence:2200}[map],'地表实例超原预算');
 else assert(layer.userData.centers.length<=(map==='confluence'?500:300),'植物簇中心超原预算');
 return{instances:records.length,edgeInstances:edges.length,clusterEdges:edges.filter(p=>p.edge==='cluster').length,placeEdges:edges.filter(p=>p.edge==='place').length,batches:batches.length};
}
function checkTreeDistances(biome){
 const leaves=[...new Set([...(g.world.foliage||[]),...(g.world.regions||[]).flatMap(r=>r.foliage||[])].map(f=>f.leaf))],tree=leaves.filter(leaf=>leaf.parent?.userData.treeBiome===biome).sort((a,b)=>a.parent.position.distanceTo(g.hero.position)-b.parent.position.distanceTo(g.hero.position))[0];
 assert(tree?.userData.treeTemplate,biome+' 缺少真实树冠 LOD');
 const material=tree.material,root=tree.parent,samples=[];
 if(biome==='forest'){
  const image=material.map?.image;assert(image?.width===1024&&image.height===1024&&image.data?.length===1024*1024*4,'扫描叶图未替换程序化回退');
  let opaque=0,empty=0;for(let i=3;i<image.data.length;i+=68){opaque+=Number(image.data[i]>128);empty+=Number(image.data[i]===0);}
  assert(opaque>2000&&empty>2000,'真实树冠 atlas 丢失叶片或透明空隙');
 }

 for(const[distance,level]of[[5,0],[20,1],[40,2]]){
  const base=Math.atan2(g.world.spawn.x-root.position.x,g.world.spawn.z-root.position.z);let point;
  for(let n=0;n<32;n++){const a=base+n*Math.PI/16,x=root.position.x+Math.sin(a)*distance,z=root.position.z+Math.cos(a)*distance;if(sceneryStandClear(x,z)){point={x,z};break;}}
  assert(point,'树冠 '+distance+'m 没有安全取景点');
  g.player.x=point.x;g.player.z=point.z;g.adventureCamera.yaw=Math.atan2(root.position.x-point.x,root.position.z-point.z);const center=new T.Box3().setFromObject(tree,true).getCenter(new T.Vector3());g.adventureCamera.pitch=Math.atan2(center.y-1.55,distance);g.adventureCamera._ready=false;step(2);
  assert(tree.userData.treeLOD===level,'真实帧未切换 '+biome+' LOD '+level);assert(tree.parent===root&&tree.material===material,'LOD 替换了材质或树对象');
  const attr=tree.geometry.attributes;assert(attr.treeSurface&&attr.treeSurface.count===attr.position.count,'树冠表面属性丢失');
  assert(tree.geometry.boundingSphere&&Number.isFinite(tree.geometry.boundingSphere.radius),'树冠包围体无效');samples.push({distance,level,canopyTriangles:(tree.geometry.index?.count||attr.position.count)/3,...reportFrame()});
 }
 assert(samples[0].canopyTriangles>samples[1].canopyTriangles&&samples[1].canopyTriangles>samples[2].canopyTriangles,'远近树冠几何未分级');return samples;
}
sceneryEdgeButton.onclick=async()=>{

 $('#scenery-edge-contact')?.remove();const sheet=document.createElement('canvas'),cellW=540,cellH=348;sheet.id='scenery-edge-contact';sheet.width=cellW*2;sheet.height=cellH*6;sheet.style.cssText='display:block;width:1080px;height:auto;margin:16px 0';sheet.setAttribute('aria-label','六图景物边缘实景：左为桌面，右为手机横屏模拟');$('#report').before(sheet);const paint=sheet.getContext('2d');paint.fillStyle='#17272b';paint.fillRect(0,0,sheet.width,sheet.height);
 try{for(const mobile of[false,true]){
  await load(mobile,mobile?844:1180,mobile?390:720);
  for(const[row,map]of['forest','snow','ash','sand','coast','confluence'].entries()){
   select('silver',0,map);g.setView('first');
   await check(map+(mobile?' 手机模拟':' 桌面')+' 景物边缘实景与预算',()=>{
    const ground=edgeLayerReport(g.world.adventureGroundDetail,'地表',map),habitat=edgeLayerReport(g.world.habitatDetail,'植被',map),view=positionClusterEdge('first');step(2);
    assert(sceneryStandClear(g.player.x,g.player.z,.55),'预览人物落进实体或水面');assert(g.camera.position.distanceTo(g.hero.position)>.5,'镜头取景异常');
    const stats=reportFrame();assert(stats.calls<2000&&stats.textures<64,'场景绘制/纹理超预算');assert(stats.pixels<=(mobile?1800000:3200000),'画面像素超预算');
    const clusters=g.world.environmentClusters;assert(clusters.draws<=30&&clusters.triangles<40000,'景物簇预算改变');
    const contact=g.world.environmentGrounding;assert(contact?.texture.format===T.RGBAFormat,'植被接地未接入');
    assert(contact.plants>0===['forest','confluence'].includes(map),'根部苔土跨地图污染或缺失');
    if(contact.plants)assert(contact.texture.image.data.some((v,i)=>i%4===1&&v>0),'根部过渡通道为空');

    if(relief){assert(relief.material===g.world.ground.material&&relief.geometry.index.count/3<=5632,'根丘材质或预算错误');assert(relief.userData.records.every(r=>r.count===97),'根丘网格异常');}
    for(const batch of [...(g.world.scenery?.batches||[]),...(g.world.regions||[]).flatMap(r=>r.scenery?.batches||[]),...g.world.habitatDetail.children])if(batch.material?.userData.fernSurface){
     assert(batch.geometry.attributes.fernStem?.count===batch.geometry.attributes.position.count,'叶柄属性丢失');
    }

    const c=g.renderer.domElement,scale=Math.min(cellW/c.width,(cellH-30)/c.height),x=(mobile?cellW:0)+(cellW-c.width*scale)/2,y=row*cellH+(cellH-30-c.height*scale)/2;paint.drawImage(c,x,y,c.width*scale,c.height*scale);paint.fillStyle='#e4eddf';paint.font='16px sans-serif';paint.fillText(map+' · '+(mobile?'手机横屏模拟':'桌面')+' · 簇 '+view.index,(mobile?cellW:0)+12,(row+1)*cellH-9);
    return{ground,habitat,cluster:view.index,biome:view.record.biome,stand:{x:view.x,z:view.z},...stats};
   });
   if(['forest','snow','confluence'].includes(map))for(const biome of map==='confluence'?['forest','snow']:[map])await check(map+' / '+biome+(mobile?' 手机模拟':' 桌面')+' 树冠近中远真实编译',()=>checkTreeDistances(biome));
  }
  await check((mobile?'手机模拟':'桌面')+' 边缘细节重开清理',()=>{
   const relief=g.world.forestFloorRelief,old=[g.world.adventureGroundDetail,g.world.habitatDetail],geometries=[...new Set(old.flatMap(group=>group.children.map(m=>m.geometry)))],counts=new Map(geometries.map(geometry=>[geometry,0]));for(const geometry of geometries)geometry.addEventListener('dispose',()=>counts.set(geometry,counts.get(geometry)+1));
   let reliefReleased=0;relief?.geometry.addEventListener('dispose',()=>reliefReleased++);
   g.menu();assert(relief?.userData.disposed&&reliefReleased===1,'旧根丘未恰好释放一次');assert(old.every(group=>group.userData.disposed&&group.children.every(m=>!m.visible)),'旧边缘实例未清理');assert([...counts.values()].every(n=>n===1),'旧边缘几何未恰好释放一次');g.start();step(2);
   assert([...counts.values()].every(n=>n===1),'重开重复释放旧几何');assert(!old.includes(g.world.adventureGroundDetail)&&!old.includes(g.world.habitatDetail),'重开复用已释放层');edgeLayerReport(g.world.adventureGroundDetail,'地表','confluence');edgeLayerReport(g.world.habitatDetail,'植被','confluence');return{released:geometries.length,...reportFrame()};
  });
 }
 errors.push(...win.qaErrors);publish();$('#status').textContent='景物边缘检查完成：'+results.filter(r=>r.pass).length+'/'+results.length+'；下方联系表为真实游戏画面，手机为尺寸/触控模拟，非真机或帧率测试。';
 }catch(e){errors.push(e.message);publish();$('#status').textContent='景物边缘检查中断：'+e.message;}finally{controls.forEach(c=>c.disabled=false);}
};
