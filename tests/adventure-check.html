<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>NEXT 双视角实测</title><style>body{margin:12px;background:#17272b;color:#e2ecea;font:14px system-ui}button{padding:10px;margin:4px;background:#254943;border:1px solid #709582;color:inherit;border-radius:5px}iframe{display:block;border:0;margin-top:8px}pre{white-space:pre-wrap}#view{overflow:auto}</style><button id="run" disabled>运行双视角回归</button><select id="preview-map" aria-label="预览地图"><option value="forest">林地</option><option value="snow">雪地</option><option value="ash">赤烬</option><option value="sand">沙漠</option><option value="coast">海港</option><option value="confluence">五境</option></select><select id="preview-place" aria-label="预览位置"><option value="spawn">出生地</option><option value="water">水岸</option><option value="trees">树丛</option></select><button id="third" disabled>第三人称预览</button><button id="first" disabled>第一人称预览</button><button id="capture" disabled>保存画面</button><p id="status">正在加载真实游戏（隔离存档，固定帧测试）</p><div id="view"></div><pre id="report"></pre><script type="module">
import * as T from '../vendor/three.module.js';
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms)),assert=(v,n)=>{if(!v)throw Error(n);};
const html=await(await fetch('../index.html')).text(),css=await(await fetch('../style.css')).text();let frame,g,win,now=0;const results=[],errors=[];
function step(n=1,ms=1000/60){for(let i=0;i<n;i++)win.qaFrame(now+=ms);}
function publish(){document.querySelector('#report').textContent=JSON.stringify({results,errors},null,2);}
async function load(mobile=false,width=1180,height=720){
 if(g){errors.push(...win.qaErrors);g.audio.stopMusic();g.cinema?.dispose();g.renderer.dispose();g.renderer.forceContextLoss();}frame?.remove();
 frame=document.createElement('iframe');frame.title='真实游戏环境预览';frame.style.width=width+'px';frame.style.height=height+'px';$('#view').append(frame);
 const boot=`<base href="../"><script>
 window.qaErrors=[];addEventListener('error',e=>qaErrors.push(e.message));addEventListener('unhandledrejection',e=>qaErrors.push(String(e.reason)));
 const log=console.error.bind(console);console.error=(...a)=>{qaErrors.push(a.map(String).join(' '));log(...a)};
 let seed=522;window.qaSeed=()=>seed=522;Math.random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
 window.requestAnimationFrame=cb=>{window.qaFrame=cb;return 0};
 const data=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>data.get(k)??null,setItem:(k,v)=>data.set(k,String(v)),removeItem:k=>data.delete(k)}});
 const media=matchMedia.bind(window);window.matchMedia=q=>q.includes('pointer:coarse')||q.includes('pointer: coarse')?{matches:${mobile},media:q,addEventListener(){},removeEventListener(){}}:media(q);
 <\/script>`;
 frame.srcdoc=html.replace('<head>','<head>'+boot);win=frame.contentWindow;
 for(let i=0;i<600&&!win.game3d;i++)await sleep(50);assert(win.game3d,'加载超时');g=win.game3d;g.audio.init=async()=>true;const render=g.renderer.render.bind(g.renderer);g.renderer.render=(scene,camera)=>{if(scene!==g.hero.parent)return render(scene,camera);win.qaCamera=camera;if(g.state==='menu'&&win.document.querySelector('#preview-detail').getAttribute('aria-pressed')!=='true'){
 const box=new T.Box3().setFromObject(g.hero,true);if(g.companionMesh)box.union(new T.Box3().setFromObject(g.companionMesh,true));const rect=win.document.querySelector('#hero-preview').getBoundingClientRect();let max=0;
 for(const x of[box.min.x,box.max.x])for(const y of[box.min.y,box.max.y])for(const z of[box.min.z,box.max.z]){const v=new T.Vector3(x,y,z).project(camera),px=(v.x+1)*win.innerWidth/2,py=(1-v.y)*win.innerHeight/2;max=Math.max(max,Math.abs((px-rect.left)/rect.width*2-1),Math.abs((py-rect.top)/rect.height*2-1));}win.qaFraming=max;
 }return render(scene,camera);};
 if(mobile){const s=win.document.createElement('style');s.textContent=css.replaceAll(/\(pointer:\s*coarse\)/g,'(min-width:0px)');win.document.head.append(s);}
 now=win.performance.now();step(2);
}
function reportFrame(){const r=g.renderer;assert(!win.qaErrors.length,win.qaErrors.join('\n'));assert(r.info.programs.every(p=>p.diagnostics?.runnable!==false),'GPU 着色器未通过');assert(r.getContext().getError()===0,'WebGL 错误');return{calls:r.info.render.calls,triangles:r.info.render.triangles,geometries:r.info.memory.geometries,textures:r.info.memory.textures,pixels:r.domElement.width*r.domElement.height};}

function select(hero='silver',index=0,map='forest'){g.menu();win.qaSeed();g.select(hero,map,index);win.qaSeed();g.start();g.player.inv=9999;g.player.attack=9999;g.player.pending=0;step(2);}
function arena(){g.world.obstacles=[];g.world.patches=[];g.player.x=g.player.z=0;g.hero.position.set(0,0,0);for(const e of g.enemies){e.alive=false;e.mesh.visible=false;}g.adventureCamera.yaw=0;g.adventureCamera.pitch=-.10;g.adventureCamera.update(0,g.player,[],{snap:true});}
function pointer(target,type,opts={}){const init={bubbles:true,pointerId:1,pointerType:'mouse',button:0,clientX:500,clientY:300,...opts};if(init.pointerType==='mouse'&&['pointerdown','pointerup'].includes(type))target.dispatchEvent(new win.MouseEvent(type==='pointerdown'?'mousedown':'mouseup',init));else target.dispatchEvent(new win.PointerEvent(type,init));}
function key(type,key){win.dispatchEvent(new win.KeyboardEvent(type,{key,bubbles:true}));}
function aimAt(e){for(let i=0;i<4;i++){step();g.adventureCamera.yaw=Math.atan2(e.x-g.camera.position.x,e.z-g.camera.position.z);g.adventureCamera.pitch=Math.atan2(e.height*.5-g.camera.position.y,Math.hypot(e.x-g.camera.position.x,e.z-g.camera.position.z));}step();}
function fire(n=30){g.player.attack=0;pointer(win.document.querySelector('#world'),'pointerdown');step(n);pointer(win,'pointerup');}
async function check(name,fn){$('#status').textContent=name;try{results.push({name,pass:true,detail:await fn()});}catch(e){results.push({name,pass:false,error:e.message});}publish();await sleep(0);}
$('#run').onclick=async()=>{
 for(const b of document.querySelectorAll('button'))b.disabled=true;results.length=0;errors.length=0;
 await check('双视角、暂停、返大厅及重开',()=>{select();g.setView('first');step(2);assert(g.firstPerson.root.visible,'第一人称武器不显示');assert(g.hero.visible,'渲染后角色visible未恢复');const mode=g.adventureCamera.mode;key('keydown','v');step();assert(g.adventureCamera.mode!==mode,'V切换失败');key('keyup','v');g.pause();const t=g.time;step(60);assert(g.time===t,'暂停推进模拟');assert(!g.controls.held,'暂停未清攻击');g.menu();step();assert(!g.firstPerson.root.visible,'大厅泄漏武器');assert(!g.atmosphere.mesh.visible,'大厅泄漏天空');g.start();step();assert(g.state==='playing','不能重开');return reportFrame();});
 await check('相机相对移动、闪避和拖动视角',()=>{select('scout');arena();g.adventureCamera.yaw=Math.PI/2;key('keydown','w');step(20);key('keyup','w');assert(g.player.x>1&&Math.abs(g.player.z)<.3,'前进未跟随视角');g.player.dash=0;key('keydown','w');g.dash();key('keyup','w');assert(Math.abs(g.player.dashAngle-Math.PI/2)<.01,'闪避不跟随视角');const yaw=g.adventureCamera.yaw,c=win.document.querySelector('#world');c.setPointerCapture=()=>{};pointer(c,'pointerdown',{button:2,clientX:300});pointer(win,'pointermove',{button:2,clientX:430});pointer(win,'pointerup',{button:2});assert(g.adventureCamera.yaw<yaw-.2,'右键拖动未转视角');return reportFrame();});
 await check('鼠标双键同时转向与开火、单独松键',()=>{select('scout');arena();const c=win.document.querySelector('#world');pointer(c,'pointerdown',{button:2});pointer(c,'pointerdown',{button:0});assert(g.controls.held,'右键中不能左键开火');pointer(win,'pointerup',{button:0});assert(!g.controls.held,'松左键仍开火');const y=g.adventureCamera.yaw;pointer(win,'pointermove',{button:2,clientX:580});assert(g.adventureCamera.yaw!==y,'松左键影响右键转向');pointer(win,'pointerup',{button:2});return reportFrame();});
 for(const [hero,count]of [['scout',3],['silver',3],['wraith',3],['tide',1],['lingya',1],['wuling',1],['mirage',1]])for(let index=0;index<count;index++)await check(hero+' 武器 '+index+' 双视角攻击',()=>{select(hero,index);arena();win.document.querySelector('[data-attack-mode="manual"]').click();g.setView('first');step(2);assert(g.firstPerson.root.visible,'没有手持武器');const e=g.spawn('golem',0,4);assert(e,'靶子生成失败');e.hp=e.maxHp=10000;e.speed=0;e.cool=9999;g.adventureCamera.pitch=-Math.atan2(g.camera.position.y-e.height*.5,4);step(2);fire(65);const damage=10000-e.hp;assert(damage>0,'第一人称攻击未命中: '+g.player.weaponId);g.setView('third');step(2);assert(!g.firstPerson.root.visible,'第三人称仍有贴面武器');aimAt(e);const before=e.hp;fire(95);assert(e.hp<before,'第三人称攻击未命中: '+g.player.weaponId);g.dash();step(35);assert(Number.isFinite(g.player.x),'闪避位置无效');return{damage,...reportFrame()};});
 await check('两种视角自动瞄准仍命中可见目标',()=>{for(const mode of ['third','first']){select('scout');arena();g.setView(mode);win.document.querySelector('[data-attack-mode="auto"]').click();const e=g.spawn('golem',0,6);e.hp=e.maxHp=10000;e.speed=0;e.cool=999;g.adventureCamera.pitch=-.1;g.player.attack=0;step(90);assert(e.hp<10000,mode+'自动瞄准不命中');}win.document.querySelector('[data-attack-mode="manual"]').click();return reportFrame();});
 await check('抬头射击越过地面敌人，转头不取消已发射攻击',()=>{select('scout');arena();g.setView('first');const e=g.spawn('golem',0,5);e.hp=e.maxHp=10000;e.speed=0;e.cool=999;g.adventureCamera.pitch=.8;step();fire(25);assert(e.hp===10000,'向天空射击仍命中地面');g.adventureCamera.pitch=-Math.atan2(g.camera.position.y-e.height*.5,5);step();g.player.attack=0;pointer(win.document.querySelector('#world'),'pointerdown');step(1);pointer(win,'pointerup');g.adventureCamera.yaw=Math.PI;step(30);assert(e.hp<10000,'转头取消弹丸伤害');return{hp:e.hp,...reportFrame()};});
 for(const map of ['forest','snow','ash','sand','coast','confluence'])await check(map+' 天空和双视角渲染',()=>{select('silver',0,map);for(const mode of ['first','third']){g.setView(mode);step(12);reportFrame();}return reportFrame();});
 for(const [width,height]of [[844,390],[390,844],[320,568]])await check(width+'×'+height+' 手机视角、按住攻击与多指',async()=>{await load(true,width,height);select('silver');arena();g.setView('first');const doc=win.document,c=doc.querySelector('#world'),a=doc.querySelector('#aim-stick'),j=doc.querySelector('#joystick');for(const q of [c,a,j])q.setPointerCapture=()=>{};const rects=[j,a,doc.querySelector('#dash')].map(q=>q.getBoundingClientRect());for(let i=0;i<rects.length;i++)for(let k=i+1;k<rects.length;k++){const r=rects[i],q=rects[k];assert(!(Math.min(r.right,q.right)>Math.max(r.left,q.left)&&Math.min(r.bottom,q.bottom)>Math.max(r.top,q.top)),'手机操作键重叠');}const y=g.adventureCamera.yaw;pointer(c,'pointerdown',{pointerType:'touch',pointerId:7,clientX:500});pointer(win,'pointermove',{pointerType:'touch',pointerId:7,clientX:560});assert(g.adventureCamera.yaw<y,'空白区域不能转向');pointer(j,'pointerdown',{pointerType:'touch',pointerId:8,clientX:j.getBoundingClientRect().x+40,clientY:j.getBoundingClientRect().y});pointer(a,'pointerdown',{pointerType:'touch',pointerId:9});assert(g.controls.held,'手机按下不攻击');pointer(a,'pointermove',{pointerType:'touch',pointerId:9,clientX:540});step(15);pointer(a,'pointerup',{pointerType:'touch',pointerId:9});assert(!g.controls.held,'松手仍攻击');pointer(j,'pointercancel',{pointerType:'touch',pointerId:8});pointer(win,'pointerup',{pointerType:'touch',pointerId:7});doc.querySelector('#view-toggle').click();step();assert(g.adventureCamera.mode==='third','手机视角按钮失败');const r=doc.querySelector('#view-toggle').getBoundingClientRect();assert(r.x>=0&&r.right<=width,'切换按钮超出屏幕');const f=reportFrame();assert(f.pixels<=1800000,'手机像素预算超限');g.pause();step(5);assert(g.state==='paused'&&!g.controls.held,'手机暂停清理失败');return f;});
 await check('全部浏览器日志',()=>{errors.push(...win.qaErrors);assert(!errors.length,errors.join('\n'));return{errors};});
 publish();$('#status').textContent=results.every(r=>r.pass)?'全部 '+results.length+' 项通过（手机为尺寸与触控模拟，非真机）':'存在失败，请查看报告';for(const b of document.querySelectorAll('button'))b.disabled=false;
};
async function preview(mode){await load();select('silver',0,$('#preview-map').value);g.setView(mode);g.adventureCamera.yaw=-.75;g.adventureCamera.pitch=mode==='first'?-.08:-.20;
 const place=$('#preview-place').value;
 if(place==='water'){const p=g.world.ponds[0];if(p){g.player.x=p.x+p.rx+2;g.player.z=p.z;g.adventureCamera.yaw=-Math.PI/2;g.adventureCamera.pitch=mode==='first'?-.23:-.32;}}
 if(place==='trees'){const trees=g.world.obstacles.filter(o=>o.mesh.getObjectByName('tree-canopy')),p=trees.find(o=>g.world.obstacles.every(q=>Math.hypot(o.x-q.x,o.z+5-q.z)>q.r+1));if(p){g.player.x=p.x;g.player.z=p.z+5;g.adventureCamera.yaw=Math.PI;g.adventureCamera.pitch=mode==='first'?.15:.05;}}
 step(30);$('#status').textContent=(mode==='first'?'第一人称':'第三人称')+' · '+$('#preview-map').selectedOptions[0].text+' · '+JSON.stringify(reportFrame());}
$('#third').onclick=()=>preview('third');$('#first').onclick=()=>preview('first');$('#capture').onclick=()=>{step();const a=document.createElement('a');a.href=g.renderer.domElement.toDataURL('image/png');a.download='forest-next-'+g.adventureCamera.mode+'.png';a.click();};
try{await load();$('#status').textContent='已就绪';for(const b of document.querySelectorAll('button'))b.disabled=false;}catch(e){$('#status').textContent=e.message;}
</script></html>
