<script type="module">

const html=await(await fetch('../index.html')).text(),css=await(await fetch('../style.css')).text(),version=html.match(/main\.js\?v=([^"']+)/)?.[1]||'',suffix=version?'?v='+version:'';

async function load(size){

 const boot=`<base href="../"><script>

 let seed=211;window.qaSeed=()=>seed=211;Math.random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};

 const data=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>data.get(k)??null,setItem:(k,v)=>data.set(k,String(v)),removeItem:k=>data.delete(k)}});

 for(let i=0;i<1200&&win.document.querySelector('#start').disabled;i++)await sleep(50);assert(!win.document.querySelector('#start').disabled,'模型预热超时');

 for(const kind of ['shot','impact','contact','weapon']){const original=g.audio[kind].bind(g.audio);g.audio[kind]=(...args)=>{const event={kind,id:args[0],phase:args[1],time:g.time};events.push(event);const played=original(...args);event.played=played===true;return played;};}

async function audioReady(){assert(await g.audio.init(),'浏览器尚未允许音效');await g.audio.materialEffects.prepare();g.audio.musicVolume=0;g.audio.sfxVolume=.12;g.audio.muted=false;g.audio.applyVolumes(true);}
function setup(route=null,rank=0,weapon='arcstaff'){
 if(g.state!=='menu')g.menu();win.qaSeed();if(g.player.weaponId!==weapon){const [hero,loadout]=Object.entries(HERO_LOADOUTS).find(([,ids])=>ids.includes(weapon));g.select(hero,'forest',loadout.indexOf(weapon));}win.document.querySelector('[data-attack-mode=manual]').click();g.start();win.document.querySelector('#dialog').close();assert(g.player.weaponId===weapon,'实际角色装备与检查目标不符');
 Object.assign(g.world,{patches:[],ponds:[],ice:[],fords:[],bridges:[],sites:[],roaming:[],discoveries:[],breakables:[],groundHeightAt:()=>0});g.world.overhead.firstHit=()=>null;
 // Block ambient spawn probes at the perimeter while attacks remain in the clear centre.

 Object.assign(g.player,{x:0,y:0,z:0,groundHeight:0,attack:999,inv:999,pending:0,level:1});g.hero.position.set(0,0,0);g.hero.rotation.y=0;
 g.adventureCamera.yaw=0;g.adventureCamera.pitch=-.08;g.adventureCamera._ready=false;g.setView(mode);Object.assign(g.controls,{angle:0,held:false,hasAim:true});

 targets=[];events=[];initial={mode,route,rank,stats:weaponStats(g.player),input:'真实 game3d.step 与 controls.held 按住/松开'};render();return weaponStats(g.player);
}
function spawn(x=0,z=3.6){const e=g.spawn('golem',x,z);assert(e,'受击目标生成失败');Object.assign(e,{x,y:0,z,hp:100000,maxHp:100000,speed:0,cool:999,damage:0,xp:0,height:6,size:.5,radius:.45});e.mesh.position.set(x,0,z);targets.push(e);return e;}
function aim(e){const distance=Math.hypot(e.x-g.player.x,e.z-g.player.z),angle=Math.atan2(e.x-g.player.x,e.z-g.player.z);g.hero.rotation.y=angle;g.controls.angle=angle;g.controls.hasAim=true;g.adventureCamera.yaw=angle+(mode==='third'?Math.asin(g.adventureCamera.shoulderOffset/distance):0);g.adventureCamera._ready=false;g.setView(mode);g.controls.hasAim=true;render();initial.camera=point(g.camera.position);initial.direction=point(g.adventureCamera.getRay().direction);}
function fire(){const before=g.hero.userData.shotSerial||0;g.player.attack=0;g.controls.held=true;step();g.controls.held=false;g.player.attack=999;assert(g.hero.userData.shotSerial===before+1,'一次手动输入未准确产生一次攻击');}
async function clearState(label){assert(!g.controls.held,label+'未清除持续输入');assert(!g.player.arcFocus,label+'遗留聚焦目标');assert(!g.bullets.length,label+'遗留弹体');for(let i=0;i<25&&(g.audio.weaponSources.size||g.audio.creatureSources.size);i++)await sleep(10);assert(!g.audio.weaponSources.size&&!g.audio.creatureSources.size,label+'停止后 250 毫秒仍遗留声音播放源');}
async function cleanup(){g.menu();g.audio.stopMusic();g.audio.stopWeapons();g.audio.stopCreatures();await clearState('离场');assert(!g.briarPods?.pods.length,'离场遗留荆棘投囊');assert(!g.riftStrikes.length&&!g.fields.length,'离场遗留法场');assert(!win.qaErrors.length,win.qaErrors.join('\n'));}
async function baseHit(){setup();const primary=spawn(),secondary=spawn(1.8,4.4),spare=spawn(-1.8,4.6);aim(primary);fire();near(damage(primary),9,'主目标伤害');near(damage(secondary),5.4,'最近副目标伤害');near(damage(spare),0,'基础攻击超过一个副目标');assert(primary.mesh.userData.hitReaction,'主目标没有受击反馈');assert(events.some(e=>e.kind==='weapon'&&e.id==='arcstaff'&&e.phase==='shot'&&e.played),'导雷出手声音未创建真实播放源');assert(events.some(e=>e.kind==='contact'&&e.id==='arcstaff'),'命中没有导雷接触反馈');const result=snapshot();advance(.8);assert(g.hero.userData.shotSerial===1,'松手仍继续攻击');await cleanup();return result;}
async function emptyShot(){setup();fire();assert(!events.some(e=>e.kind==='contact'),'空射产生肉体接触');assert(!g.player.arcFocus,'空射保留聚焦');assert(!g.bullets.length,'瞬时导雷留下追踪弹体');advance(.8);assert(g.hero.userData.shotSerial===1,'空射松手后仍继续攻击');const result=snapshot();await cleanup();return result;}
async function blocked(chain){setup();const primary=spawn(),secondary=spawn(2.1,3.6);aim(primary);g.world.obstacles.push(chain?{x:1.05,y:0,z:3.6,r:.35,height:8}:{x:0,y:0,z:1.9,r:1,height:8});fire();near(damage(primary),chain?9:0,'障碍前主目标伤害');near(damage(secondary),0,'电弧穿过实体障碍');const result=snapshot();await cleanup();return result;}
async function outOfRange(){setup();const primary=spawn(0,8.5),secondary=spawn(2.5,10.5);aim(primary);fire();near(damage(primary),9,'射程内主目标伤害');near(damage(secondary),0,'跳电超过出手点总射程');const result=snapshot();await cleanup();return result;}
async function chainRoute(rank){setup('arcstaff_chain',rank);const primary=spawn(),chain=[primary,spawn(1.35,3.8),spawn(2.7,4),spawn(4.05,4.2),spawn(5.4,4.4),spawn(6.75,4.6)];aim(primary);fire();for(let i=0;i<chain.length;i++)near(damage(chain[i]),i===0?8.1:i<=rank+1?4.86:0,'连枝路线 '+rank+' 阶目标 '+(i+1));const result=snapshot();await cleanup();return result;}
async function focusRamp(rank){setup('arcstaff_focus',rank);const primary=spawn(),neighbor=spawn(1.8,4.4);aim(primary);g.player.attack=0;g.controls.held=true;const hits=[];for(let i=0;i<180&&hits.length<8;i++){const before=primary.hp;step();if(primary.hp!==before)hits.push({time:g.time,damage:before-primary.hp});}g.controls.held=false;assert(hits.length===8,'持续按住未产生八次导雷');near(hits[0].damage,9,'聚焦首击伤害');const cap=[.55,.8,1.05][rank-1];for(const hit of hits)near(hit.damage,9*(1+cap*Math.min(1,(hit.time-hits[0].time)/1.25)),'持续聚焦伤害');near(hits.at(-1).damage,9*(1+cap),'聚焦上限');near(damage(neighbor),0,'聚焦路线仍产生副跳');const serial=g.hero.userData.shotSerial;advance(.8);assert(g.hero.userData.shotSerial===serial,'松手仍有排队导雷');const result={hits,...snapshot()};await cleanup();return result;}
async function focusReset(kind){setup('arcstaff_focus',3);const primary=spawn(),other=spawn(-2.5,4);aim(primary);fire();advance(.25);fire();assert(g.player.arcFocus?.started<g.player.arcFocus?.time,'聚焦没有累积');let target=primary;
 if(kind==='target'){target=other;aim(other);}else if(kind==='gap')advance(.6);else if(kind==='miss'){g.adventureCamera.yaw=Math.PI;g.adventureCamera._ready=false;g.setView(mode);g.controls.angle=Math.PI;render();fire();assert(!g.player.arcFocus,'未命中没有清除聚焦');aim(primary);}
 const hp=target.hp;fire();near(hp-target.hp,9,'聚焦 '+kind+' 后首击未复位');assert(g.player.arcFocus?.target===target,'聚焦未切换到真实对象');const result=snapshot();await cleanup();return result;}
async function lifecycle(kind){setup('arcstaff_focus',3);const target=spawn();aim(target);fire();assert(g.player.arcFocus,'清理前未创建聚焦');g.controls.held=true;const serial=g.hero.userData.shotSerial,time=g.time;
 if(kind==='pause'){g.pause();await clearState('暂停');advance(.7);assert(g.time===time&&g.hero.userData.shotSerial===serial,'暂停推进了战斗');g.resume();advance(.7);assert(g.hero.userData.shotSerial===serial,'恢复后无输入仍继续导雷');}
 else if(kind==='death'){g.player.inv=0;assert(g.damage(10000,0,-2),'致命伤害未生效');assert(g.state==='lost','未进入失败状态');await clearState('死亡');advance(.7);assert(g.hero.userData.shotSerial===serial,'死亡后仍继续导雷');}
 else if(kind==='menu'){g.menu();await clearState('菜单');}
 else if(kind==='dash'){g.dash();assert(g.player.dashTime>0,'闪避未启动');assert(!g.player.arcFocus,'闪避遗留聚焦');g.controls.held=false;advance(.7);assert(g.hero.userData.shotSerial===serial,'闪避后松手仍继续导雷');}
 else{g.menu();g.start();await clearState('重开');assert(!g.hero.userData.shotSerial,'新对局继承攻击序号');assert(g.player.weaponId==='arcstaff','重开丢失选择的武器');}
 const result=snapshot();await cleanup();return result;
}
async function experienceOnce(){setup();const primary=spawn(),secondary=spawn(1.8,4.4);primary.hp=1;primary.xp=7;secondary.hp=1;secondary.xp=11;aim(primary);fire();assert(!primary.alive&&!secondary.alive,'致命电弧没有击倒两个目标');assert(g.orbs.length===2,'击倒没有各自产生一次经验球');for(const orb of g.orbs)orb.attract=true;advance(.8);near(g.player.xp,18,'击倒经验');assert(!g.orbs.length,'经验球没有正确回收');fire();advance(.6);near(g.player.xp,18,'重复攻击死目标产生额外经验');const result=snapshot();await cleanup();return result;}
async function legalRoutes(){const details=[];for(const route of ['arcstaff_chain','arcstaff_focus']){setup();const sibling=route==='arcstaff_chain'?'arcstaff_focus':'arcstaff_chain';assert(WEAPON_PATHS[route]?.weapon==='arcstaff','路线武器归属错误');for(let rank=0;rank<3;rank++){g.player.level=[2,4,7][rank];assert(!takeUpgrade(g.player,'path:'+route),'提前领取路线');g.player.level=[3,5,8][rank];assert(takeUpgrade(g.player,'path:'+route),'无法按 3/5/8 领取路线');assert(g.player.weaponPath.rank===rank+1,'路线阶数不符');assert(!takeUpgrade(g.player,'path:'+sibling),'允许混选另一条路线');details.push({route,level:g.player.level,rank:g.player.weaponPath.rank,stats:weaponStats(g.player)});}assert(!takeUpgrade(g.player,'path:'+route),'路线突破三阶');assert(!chooseUpgrades(g.player).some(c=>c.category==='weapon'),'满阶继续提供路线');await cleanup();}return details;}
async function grips(){setup();const target=spawn();aim(target);render();assert(g.firstPerson.root.visible,'第一人称持械未显示');fire();let gap=0;for(let i=0;i<45;i++){render();const v=g.firstPerson;for(const hand of v.hands)assert([...hand.position.toArray(),...hand.quaternion.toArray(),...hand.scale.toArray()].every(Number.isFinite),'手掌变换出现非数值');assert(v.weapon.matrixWorld.elements.every(Number.isFinite),'导雷杖变换出现非数值');const palm=v.hands[0].localToWorld(v.hands[0].position.clone().set(0,.045,-.023)),anchor=v.weapon.localToWorld(v.grip.clone());gap=Math.max(gap,palm.distanceTo(anchor));}assert(gap<1e-6,'手掌脱离导雷杖握点');near(damage(target),9,'第一人称持械真实命中');const result={gap,...snapshot()};await cleanup();return result;}
function aimGround(target){aim(target);const distance=Math.hypot(target.x-g.player.x,target.z-g.player.z),offset=mode==='third'?g.adventureCamera.shoulderOffset:0;g.adventureCamera.pitch=Math.atan2(-g.adventureCamera._target.y,Math.sqrt(distance*distance-offset*offset));g.adventureCamera._ready=false;g.setView(mode);g.controls.hasAim=true;render();}
const podState=p=>({state:p.state,x:p.x,y:p.y,z:p.z,delay:p.delay,arm:p.arm,life:p.life,flight:p.flight});
async function briarSmoke(miss=false){
 const stats=setup(null,0,'briarpot');assert(HERO_LOADOUTS.lingya[1]==='briarpot','投囊没有位于铃芽第二套装备');assert(g.briarPods,'投囊运行时未接入真实游戏');assert(g.companion,'铃芽投囊丢失伙伴');near(stats.petDamage,30,'投囊伙伴基础伤害');near(stats.petCooldown,2.35,'投囊伙伴基础冷却');assert(!win.document.querySelector('#companion-status').hidden,'投囊没有显示伙伴面板');
 g.player.level=8;assert(takeUpgrade(g.player,'care'),'投囊不能合法领取伙伴照护');const careBefore=g.heroSkills.newHeroes.careHits;
 const primary=miss?null:spawn(0,6),secondary=miss?null:spawn(1.1,6);for(const e of targets)e.height=1.5;aimGround(primary||{x:0,z:6});fire();assert(g.briarPods.pods.length===1,'手动投掷没有创建一个真实投囊');const pod=g.briarPods.pods[0],states=[podState(pod)];assert(pod.state==='held','投囊没有经历离手等待');if(primary)near(damage(primary),0,'按下即造成伤害');
 advance(.3);states.push(podState(pod));assert(pod.state==='flight'&&pod.y>.12,'投囊没有形成空中抛物线');assert([pod.x,pod.y,pod.z,pod.vx,pod.vy,pod.vz].every(Number.isFinite),'投囊轨迹出现非数值');if(primary)near(damage(primary),0,'空中投囊提前造成伤害');
 for(let i=0;i<180&&pod.state==='flight';i++)step();assert(pod.state==='armed','投囊没有落地蓄发');states.push(podState(pod));if(primary)near(damage(primary),0,'投囊落地未等待即造成伤害');const frozen=JSON.stringify(podState(pod)),time=g.time;g.pause();advance(.7);assert(g.time===time&&JSON.stringify(podState(pod))===frozen,'暂停未冻结落地投囊');assert(g.briarPods.pods.includes(pod),'暂停清除了已落地投囊');g.resume();advance(.7);
 assert(!g.briarPods.pods.length,'爆发后投囊未回收');if(primary){near(damage(primary),stats.damage,'投囊主目标一次爆发伤害');near(damage(secondary),stats.damage,'投囊范围爆发伤害');assert(primary.lingyaMark>0&&!(secondary.lingyaMark>0),'一次爆发未仅标记最近目标');assert(g.heroSkills.newHeroes.careHits===careBefore+1,'一次爆发多次累计照护');}else{assert(!events.some(e=>e.kind==='contact'),'空投爆发产生肉体接触');assert(g.heroSkills.newHeroes.careHits===careBefore,'空投累计命中照护');}
 const result={states,...snapshot()};await cleanup();return result;
