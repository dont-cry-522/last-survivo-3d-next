<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>五境声音试听</title>
<style>
:root{color-scheme:dark;font:16px/1.6 system-ui,sans-serif;background:#101d22;color:#e3eeeb}body{max-width:1120px;margin:auto;padding:30px 22px}h1{font-size:30px;margin:0 0 8px}h2{font-size:21px;margin:0 0 12px}p{color:#abc3c2;margin:8px 0 18px}section{margin:22px 0;padding:22px;background:#172a30;border:1px solid #315059;border-radius:15px}button,select{font:inherit;background:#254850;color:#f3f8ed;border:1px solid #456971;border-radius:9px;padding:8px 15px;cursor:pointer}button:hover{background:#34636a}button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.weapon{display:grid;grid-template-columns:minmax(170px,1fr) repeat(3,auto);gap:10px;align-items:center;padding:13px 0;border-top:1px solid #2c464d}.weapon small{display:block;color:#aec6c3}.status{color:#c9dda6;min-height:26px}pre{font:14px/1.6 ui-monospace,monospace;white-space:pre-wrap;background:#0b171c;padding:16px;border-radius:10px;min-height:36px}canvas{width:100%;height:110px;background:#0b171c;border-radius:10px;margin-top:12px}@media(max-width:650px){body{padding:18px 12px}.weapon{grid-template-columns:repeat(3,1fr)}.weapon>div{grid-column:1/-1}button{padding:8px 10px}section{padding:15px}}
</style>
<h1>五境声音试听</h1><p>这里使用游戏里的实际配乐、武器声音和混音。点击地图听探索曲，暂停后会从原位置继续。<a href="weapon-context-check.html">结合人物动作试听</a>。</p>
<section><h2>地图配乐</h2><div class="row" id="maps">
<button data-map="forest">森林</button><button data-map="snow">雪地</button><button data-map="ash">灰烬</button><button data-map="coast">海岸</button><button data-map="sand">沙漠</button><button id="battle">战斗</button>
</div><p class="status" id="music-status">点击一张地图开始试听。</p><div class="row"><button id="pause">暂停音乐</button><button id="resume">继续音乐</button><button id="stop">停止所有声音</button><label>音乐音量 <input id="music-volume" type="range" min="0" max="100" value="65"></label><label>音效音量 <input id="sfx-volume" type="range" min="0" max="100" value="80"></label></div></section>
<section><h2>武器材质</h2><p>新版使用木、金属、冰裂、电弧、液体与纸张等素材重新设计。可切换旧版作对照，连续点击试听不同取样。</p><label>声音版本 <select id="sound-version"><option value="material">新版材质音效</option><option value="legacy">旧版合成音效（对照）</option></select></label> <label>动作 <select id="variant"><option value="0">普通</option><option value="1">强击 / 第二段</option><option value="2">第三段</option></select></label><canvas id="wave" width="1000" height="110"></canvas><p class="status" id="weapon-status">尚未播放武器声音。</p><div id="weapons"></div></section>
<section><h2>元素与闪避</h2><div class="row" id="elements"></div><p><a href="material-audio-check.html">打开材质音效专项检查</a></p></section><section><h2>声音检查</h2><p>真实解码五首本地配乐，检查暂停续播、地图切换、音量与静音、战斗迟滞和后备音乐。需要约 20 秒。</p><button id="check">运行声音检查</button><pre id="results" aria-live="polite">等待开始。</pre><pre id="diagnostics" aria-live="polite">尚未开启音频。</pre></section>
<script type="module">
import{GameAudio}from'../audio.js?v=192';
import{weaponSample}from'../weapon-audio.js?v=192';
const $=s=>document.querySelector(s),audio=new GameAudio();
audio.setSfxStyle('standard',{persist:false});
let map='forest',mode='paused',boss=false,pressure=0,last=performance.now(),checking=false,testClock=0,testDriver=null;
const names={forest:'森林',snow:'雪地',ash:'灰烬',coast:'海岸',sand:'沙漠',battle:'战斗'};
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const ensure=async()=>{if(!await audio.init())throw Error('浏览器尚未开启声音');audio.muted=false;audio.applyVolumes(true);await audio.materialEffects.prepare();};
const choose=async(key,battle=false)=>{await ensure();map=key;mode='playing';boss=battle;pressure=battle?1:0;audio.update(0,{map,mode,boss,pressure,seamless:true});};
$('#sound-version').onchange=()=>audio.setSfxStyle($('#sound-version').value==='legacy'?'legacy':'standard',{persist:false});
$('#music-volume').value=audio.musicVolume*100;$('#sfx-volume').value=audio.sfxVolume*100;
for(const bus of['music','sfx'])$('#'+bus+'-volume').oninput=e=>{audio[bus+'Volume']=Number(e.target.value)/100;audio.applyVolumes();};
$('#maps').onclick=e=>{if(e.target.dataset.map&&!checking)choose(e.target.dataset.map);};
$('#battle').onclick=()=>{if(!checking)choose(map,true);};
$('#pause').onclick=()=>{if(!checking)mode='paused';};
$('#resume').onclick=()=>{if(!checking)choose(map,boss);};
$('#stop').onclick=()=>{mode='paused';audio.muted=true;audio.applyVolumes();audio.stopWeapons();audio.stopCreatures();};
const weapons=[['crossbow','弩','短弓弦、拉弦与锁扣'],['rifle','步枪','短促干裂与枪管气压'],['shotgun','霰弹枪','厚重爆发与散弹落点'],['shuriken','飞镖','两次掠风与短金属接触'],['fire','火焰','不规则燃烧与低沉爆燃'],['dark','暗术','吸入与低频气压'],['shade','幽影','收束的暗流'],['shadowblade','影刃','低声抽离与切割'],['grimoire','魔典','纸页气息与空腔释放'],['harpoon','鱼叉','推进、横扫与拖拽'],['boomerang','回旋镖','旋转木刃与回收'],['sporelantern','毒囊','气雾与轻微破囊'],['miasmalantern','幻雾灯','聚雾吐息与气雾扩散']];
for(const[id,name,material]of weapons){
 const row=document.createElement('div');row.className='weapon';const title=document.createElement('div');title.textContent=name;const detail=document.createElement('small');detail.textContent=material;title.append(detail);row.append(title);
 for(const[event,label]of[['shot','出手'],['impact','命中'],[id==='miasmalantern'?'charge':'mechanism',id==='miasmalantern'?'吸气':'收放']]){
  const button=document.createElement('button');button.textContent=label;button.setAttribute('aria-label',name+' '+label);button.onclick=async()=>{
   await ensure();const variant=Number($('#variant').value),bank=audio.materialEffects,legacy=$('#sound-version').value==='legacy',take=audio.weaponTakes.get(id+':'+event+':'+variant)||0,key=bank.count(id+':'+event+':'+variant)?id+':'+event+':'+variant:id+':'+event,cue=audio.materialCue(key,take);const samples=cue?cue.buffer.getChannelData(0).subarray(Math.floor(cue.offset*cue.buffer.sampleRate),Math.floor((cue.offset+cue.duration)*cue.buffer.sampleRate)):weaponSample(id,event,22050,variant);audio.weapon(id,event,variant);$('#weapon-status').textContent=(legacy?'旧版合成':cue?'新版材质':'后备声音')+' · '+name+' · '+label+' · '+material;
   const canvas=$('#wave'),ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#accda6';ctx.beginPath();for(let x=0;x<canvas.width;x++){const v=samples?.[Math.floor(x/canvas.width*samples.length)]||0,y=55-v*75;if(x)ctx.lineTo(x,y);else ctx.moveTo(x,y);}ctx.stroke();
  };row.append(button);
 }$('#weapons').append(row);
}
for(const[kind,label]of[['ice','碎冰'],['storm','电弧'],['fire','爆燃'],['chain','锁链'],['rift','裂隙'],['dark','暗幕']]){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{await ensure();audio.spell(kind);};$('#elements').append(b);}for(const[kind,label]of[['roll','翻滚'],['blink','瞬移'],['water','入水']]){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{await ensure();if(kind==='water')audio.water(true);else audio.dodge(kind==='blink');};$('#elements').append(b);}
function diagnostics(){const r=audio.recorded;return JSON.stringify({visibility:document.visibilityState,context:audio.ctx?.state,contextTime:audio.ctx?.currentTime,sampleRate:audio.ctx?.sampleRate,ready:audio.ready,effectBank:audio.materialEffects?.buffer?'已解码':audio.materialEffects?.loading?'加载中':'未载入',effectError:audio.materialEffects?.error?.message,mode,map,desired:r?.desired,current:r?.current?.key,loading:r?.loading&&{key:r.loading.key,stage:r.loading.stage,bytes:r.loading.bytes},failed:r&&[...r.failed],error:r?.lastError,cache:r&&[...r.cache.keys()],hot:r?.hot,calm:r?.calm,testClock},null,2);}
function display(){
 if(audio.ready){const r=audio.recorded,current=r?.current;$('#music-status').textContent=mode==='paused'?'音乐已暂停':current?'正在播放：'+names[current.key]+' · '+current.buffer.duration.toFixed(1)+' 秒 · 已解码 '+r.cache.size+' 首':r?.loading?'正在载入 '+names[r.loading.key]+'，播放后备音乐…':'正在播放：'+names[map]+' 合成后备音乐';}requestAnimationFrame(frame);
 $('#diagnostics').textContent=diagnostics();
}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!checking)audio.update(dt,{map,mode,boss,pressure,seamless:true});display();}
requestAnimationFrame(frame);
function driveTest(){const now=performance.now(),dt=(now-testClock)/1000;testClock=now;audio.update(dt,{map,mode,boss,pressure,seamless:true});$('#diagnostics').textContent=diagnostics();}
const assert=(condition,message)=>{if(!condition)throw Error(message);};
const until=async(check,timeout=25000)=>{const start=performance.now();while(!check()){if(audio.recorded?.failed.has(audio.recorded.desired))throw Error('曲目载入失败 '+JSON.stringify(audio.recorded.lastError));if(performance.now()-start>timeout)throw Error('等待声音状态超时');await wait(40);}};
$('#check').onclick=async()=>{
 if(checking)return;checking=true;$('#check').disabled=true;$('#results').textContent='正在检查…';const lines=[],report=line=>{$('#results').textContent=lines.concat(line).join('\n');lines.push(line);};
 const saved={music:audio.musicVolume,sfx:audio.sfxVolume,muted:audio.muted};
 try{
  await ensure();testClock=performance.now();testDriver=setInterval(driveTest,40);
  for(const key of['forest','snow','ash','coast','battle']){
   audio.recorded.reset();await choose(key==='battle'?'coast':key,key==='battle');await until(()=>audio.recorded.current?.key===key);
   const voice=audio.recorded.current,buffer=voice.buffer;assert(buffer.duration>20,'曲目过短 '+key);assert(voice.source.loop,'曲目未循环 '+key);assert(audio.recorded.cache.size<=2,'配乐缓存超限');
   let peak=0,energy=0;const channel=buffer.getChannelData(0);for(let i=0;i<channel.length;i++){const value=channel[i];assert(Number.isFinite(value),'解码出现非有限采样');peak=Math.max(peak,Math.abs(value));energy+=value*value;}assert(peak>0&&peak<1,'静音或削波 '+key);assert(energy>1,'曲目没有能量');report('通过 · '+names[key]+'真实解码与循环 · '+buffer.duration.toFixed(2)+'s · '+buffer.sampleRate+'Hz · PCM '+(buffer.length*buffer.numberOfChannels*4/1048576).toFixed(1)+'MiB · peak '+peak.toFixed(3));
  }
  audio.recorded.reset();await choose('forest');await until(()=>audio.recorded.current?.key==='forest');await wait(450);
  mode='paused';await until(()=>audio.recorded.paused);const offset=audio.recorded.offsets.get('forest');assert(offset>.3,'暂停未记录位置');await wait(150);assert(!audio.recorded.current&&audio.recorded.fading.size===0,'暂停遗留播放源');
  mode='playing';await until(()=>audio.recorded.current?.key==='forest');assert(Math.abs(audio.recorded.current.offset-offset)<.03,'继续播放从曲首重开');report('通过 · 暂停回收与原位续播');
  const current=audio.recorded.current;audio.musicVolume=.3;audio.applyVolumes();audio.muted=true;audio.applyVolumes();await wait(150);audio.muted=false;audio.musicVolume=saved.music;audio.applyVolumes();assert(audio.recorded.current===current,'音量或静音重启了音乐');report('通过 · 音量与静音保持播放位置');
  pressure=.9;await wait(3000);assert(!audio.recorded.battle,'短时压力过早触发战斗');await until(()=>audio.recorded.battle,3000);await until(()=>audio.recorded.current?.key==='battle');
  pressure=.1;await wait(4000);assert(audio.recorded.battle,'战斗过早恢复探索');await until(()=>!audio.recorded.battle,6500);await until(()=>audio.recorded.current?.key==='forest');report('通过 · 持续压力进入战斗与缓慢恢复探索');
  await choose('sand');await until(()=>!audio.recorded.current);await until(()=>audio.scoreMusic.gain.value>.99,5000);report('通过 · 无录音地图平滑恢复后备音乐');
  for(const[id]of weapons)for(const event of['shot','impact']){assert(audio.weapon(id,event),'武器未生成声音 '+id);audio.stopWeapons();await wait(15);}await wait(100);assert(!audio.weaponSources.size,'武器声音未回收');report('通过 · 全部武器出手、命中与停止');
  report('全部声音检查通过。');
 }catch(error){report('失败 · '+error.message+'\n失败时状态：\n'+diagnostics());}
 finally{clearInterval(testDriver);testDriver=null;mode='paused';boss=false;pressure=0;audio.musicVolume=saved.music;audio.sfxVolume=saved.sfx;audio.muted=saved.muted;audio.applyVolumes();checking=false;$('#check').disabled=false;}
};
</script></html>
