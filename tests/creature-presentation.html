<!doctype html><meta charset="utf-8"><title>五境怪物表现检查</title>
<style>body{background:#192821;color:#f0e9d8;font:15px system-ui;margin:16px}button,select{padding:8px}canvas{display:block;max-width:100%;margin-top:12px}#portraits img{width:160px;background:#25352f;border-radius:12px;margin:6px}pre{white-space:pre-wrap}</style>
<h1>五境怪物 · 实际模型与连续动作</h1>
<p>每张地图五种普通怪物，使用正式模型、动作与共享材质；本页不写玩家存档。</p>
<select id="biome"><option value="forest">森林</option><option value="snow">雪地</option><option value="ash">灰烬</option><option value="sand">沙漠</option><option value="coast">海港</option><option value="air">五境飞行怪</option></select><select id="mode"><option value="walk">行走</option><option value="attack">蓄力 → 攻击 → 收招</option><option value="idle">待机</option></select>
<label><input type="checkbox" id="old">旧造型对照</label><button id="pause">暂停</button><button id="step">前进 0.1 秒</button><button id="portraits-button">生成正式图鉴图片</button>
<button id="checks">检查全部怪物</button><button id="hit">受击预览</button><button id="still">固定展示姿势</button><pre id="checks-report"></pre><pre id="report">LOADING</pre><div id="stage"></div><div id="portraits"></div>
<script type="module">
import * as T from '../vendor/three.module.js';
import {actor,animateActor} from '../world.js?v=191';
import {AIR_ROSTERS,AIR_ENEMIES,makeAirborne,animateAirborne} from '../airborne-enemies.js?v=191';
import {setCreatureTime} from '../creature-forms.js?v=191';
import {MAP_ROSTERS} from '../map-enemies.js?v=191';
import {recordEnemyHit} from '../enemy-feedback.js?v=191';
import {enemyCastFlight} from '../enemy-cast-vfx.js?v=191';
import {SkillVFX} from '../skill-vfx.js?v=191';
import {ENEMY_MOTION} from '../enemy-motion.js?v=191';
let kinds=[];const scene=new T.Scene(),renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(1120,460);renderer.setClearColor(0x25382f);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
document.querySelector('#stage').append(renderer.domElement);scene.add(new T.HemisphereLight(0xd8e6f0,0x293c30,2.0));
const sun=new T.DirectionalLight(0xffe6c2,3.6);sun.position.set(3,7,5);scene.add(sun);const rim=new T.DirectionalLight(0x93cfd9,1.3);rim.position.set(-4,3,-3);scene.add(rim);
const floor=new T.Mesh(new T.PlaneGeometry(25,10),new T.MeshStandardMaterial({color:0x3b4c3c,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.015;scene.add(floor);
const camera=new T.OrthographicCamera(-8.25,8.25,2.80,-2.80,.1,60);camera.position.set(0,4.6,16);camera.lookAt(0,.9,0);
const vfx=new SkillVFX(scene,{groundHeight:()=>0});const lastEffects=new Map();
let models=[],clock=0,last=0,paused=false;
function reset(){lastEffects.clear();kinds=document.querySelector('#biome').value==='air'?Object.values(AIR_ROSTERS):Object.values(MAP_ROSTERS[document.querySelector('#biome').value]).slice(0,5);vfx.clear();for(const m of models)scene.remove(m);models=kinds.map((kind,i)=>{const m=AIR_ENEMIES[kind]?makeAirborne(kind):actor(kind,undefined,!document.querySelector('#old').checked);m.position.x=(i-2)*3.1;m.rotation.y=.35;scene.add(m);return m;});clock=0;draw();}
function draw(){setCreatureTime(clock);const mode=document.querySelector('#mode').value;for(const [i,m] of models.entries()){const cfg=ENEMY_MOTION[kinds[i]]||{wind:1},phase=clock%2.8,wind=mode==='attack'&&phase<cfg.wind?cfg.wind-phase:0;if(AIR_ENEMIES[kinds[i]])animateAirborne({kind:kinds[i],mesh:m,id:i,flight:{stage:mode==='attack'?(wind>0?'wind':phase<1.6?'strike':'recover'):'orbit'}},clock);else animateActor(m,clock,mode==='walk'?3:0,wind);if(mode==='attack'&&phase>=cfg.wind&&phase<cfg.wind+.04&&lastEffects.get(kinds[i])!==Math.floor(clock/2.8)&&['spitter','icewitch','cinderwisp','sandspitter','jellyseer'].includes(kinds[i])){lastEffects.set(kinds[i],Math.floor(clock/2.8));enemyCastFlight(vfx,{mesh:m,x:m.position.x,y:0,z:0,tx:m.position.x,tz:2,zone:({icewitch:'frost',cinderwisp:'ember',sandspitter:'sand',jellyseer:'tide'})[kinds[i]]||'poison'},()=>0);}}renderer.render(scene,camera);document.querySelector('#report').textContent=JSON.stringify({status:'READY',mode,time:+clock.toFixed(2),biome:document.querySelector('#biome').value,polished:!document.querySelector('#old').checked,drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles});}
document.querySelector('#biome').onchange=reset;document.querySelector('#mode').onchange=reset;document.querySelector('#hit').onclick=()=>{for(const m of models)recordEnemyHit(m,{damage:20,kind:'rifle',angle:.5});clock+=1/60;draw();};document.querySelector('#still').onclick=()=>{paused=true;document.querySelector('#pause').textContent='继续';document.querySelector('#mode').value='idle';reset();for(let i=1;i<=30;i++){clock=i/60;draw();}};document.querySelector('#old').onchange=reset;document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'继续':'暂停';};document.querySelector('#step').onclick=()=>{paused=true;document.querySelector('#pause').textContent='继续';clock+=.1;vfx.update(.1);draw();};
document.querySelector('#portraits-button').onclick=()=>{const root=document.querySelector('#portraits');root.replaceChildren();const r=new T.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});r.setSize(256,256);r.setClearColor(0,0);r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.25;const s=new T.Scene();s.add(new T.HemisphereLight(0xd8e6f0,0x293c30,2.0));s.add(sun.clone(),rim.clone());for(const kind of [...Object.values(MAP_ROSTERS).flatMap(roster=>Object.values(roster).slice(0,5)),...Object.values(AIR_ROSTERS)]){const m=AIR_ENEMIES[kind]?makeAirborne(kind):actor(kind);s.add(m);const bounds=new T.Box3().setFromObject(m),center=bounds.getCenter(new T.Vector3()),size=bounds.getSize(new T.Vector3()),half=Math.max(size.x,size.y,size.z)*.67,c=new T.OrthographicCamera(-half,half,half,-half,.1,60);c.position.copy(center).add(new T.Vector3(4,2.2,6).normalize().multiplyScalar(20));c.lookAt(center);r.render(s,c);const img=document.createElement('img');img.id='portrait-'+kind;img.alt=kind;img.src=r.domElement.toDataURL('image/png');root.append(img);s.remove(m);}r.dispose();};
document.querySelector('#checks').onclick=()=>{
 const results=[];let error=null;
 try{for(const biome of [...Object.keys(MAP_ROSTERS),'air']){document.querySelector('#biome').value=biome;reset();for(const mode of ['idle','walk','attack']){document.querySelector('#mode').value=mode;reset();for(let i=0;i<210;i++){clock=i/60;vfx.update(1/60);draw();}for(const m of models){m.updateMatrixWorld(true);m.traverse(o=>{if(!o.matrixWorld.elements.every(Number.isFinite))throw Error(biome+' '+mode+' invalid pose');});}if(renderer.getContext().getError()!==0||renderer.info.programs.some(p=>p.diagnostics?.runnable===false))throw Error(biome+' shader/GL');results.push({biome,mode,calls:renderer.info.render.calls,triangles:renderer.info.render.triangles});}}
 }catch(e){error=String(e);}finally{paused=true;document.querySelector('#pause').textContent='继续';document.querySelector('#checks-report').textContent=JSON.stringify({results,error});}
};
reset();function frame(now){if(!paused){const dt=Math.min(.04,(now-last)/1000||0);clock+=dt;vfx.update(dt);draw();}last=now;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
