<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>五境围猎与反击窗口检查</title>
<style>body{margin:12px;background:#13242b;color:#e1e9e4;font:14px system-ui}button{padding:10px;margin:0 6px 6px 0;background:#254943;color:inherit;border:1px solid #709582;border-radius:6px}iframe{border:0;display:block;margin-top:12px}#view{overflow:auto}pre{white-space:pre-wrap;max-height:180px;overflow:auto}</style>
<button id="desktop" disabled>检查电脑五境</button><button id="landscape" disabled>检查手机横屏五境</button><button id="portrait" disabled>检查手机竖屏五境</button><button id="all" disabled>运行全部十五组检查</button>
<p id="status">加载中。本页使用隔离存档与固定帧；手机尺寸为模拟，不代表真机帧率。</p><pre id="report"></pre><div id="view"></div>
<script type="module">
import {Vector3} from '../vendor/three.module.js';
const $=s=>document.querySelector(s),sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms)),assert=(value,message)=>{if(!value)throw Error(message);};
const html=await(await fetch('../index.html')).text(),css=await(await fetch('../style.css')).text(),version=html.match(/main\.js\?v=([^"']+)/)?.[1]||'';
const {MAP_ROSTERS}=await import('../map-enemies.js'+(version?'?v='+version:''));
const {ENEMIES}=await import('../rules.js'+(version?'?v='+version:''));
let frame,win,g,now=0;const results=[],errors=[];
const publish=()=>$('#report').textContent=JSON.stringify({version,results,errors},null,2);
const buttons=disabled=>{for(const button of document.querySelectorAll('button'))button.disabled=disabled;};
function renderFrames(n=1){for(let i=0;i<n;i++)win.qaFrame(now+=1000/60);}
function step(){g.step(1/60);g.vfx.update(1/60);}
function advance(seconds){for(let i=0;i<Math.ceil(seconds*60);i++)step();}
function until(condition,label,seconds=3){for(let i=0;i<seconds*60&&!condition();i++)step();assert(condition(),label);}
async function load({width,height,mobile}){
 if(g){errors.push(...win.qaErrors);g.audio.stopMusic();g.cinema?.dispose();g.renderer.dispose();g.renderer.forceContextLoss();}frame?.remove();
 frame=document.createElement('iframe');frame.title='五境围猎真实游戏检查';frame.style.width=width+'px';frame.style.height=height+'px';$('#view').append(frame);
 const boot=`<base href="../"><script>
 window.qaErrors=[];addEventListener('error',e=>qaErrors.push(e.message));addEventListener('unhandledrejection',e=>qaErrors.push(String(e.reason)));
 const log=console.error.bind(console);console.error=(...a)=>{qaErrors.push(a.map(String).join(' '));log(...a)};
 let seed=204;window.qaSeed=()=>seed=204;Math.random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
 window.requestAnimationFrame=cb=>{window.qaFrame=cb;return 0};
 const data=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>data.get(k)??null,setItem:(k,v)=>data.set(k,String(v)),removeItem:k=>data.delete(k)}});
 const media=matchMedia.bind(window);window.matchMedia=q=>q.includes('pointer:coarse')||q.includes('pointer: coarse')?{matches:${mobile},media:q,addEventListener(){},removeEventListener(){}}:media(q);
 <\/script>`;
 frame.srcdoc=html.replace('<head>','<head>'+boot);win=frame.contentWindow;
 for(let i=0;i<1200&&!win.game3d;i++)await sleep(50);assert(win.game3d,'游戏加载超时');g=win.game3d;
 assert(await g.surfaceReady,'材质加载失败');g.audio.init=async()=>true;g.audio.setMuted(true);
 if(mobile){const style=win.document.createElement('style');style.textContent=css.replaceAll(/\(pointer:\s*coarse\)/g,'(min-width:0px)');win.document.head.append(style);}
 for(let i=0;i<1200&&win.document.querySelector('#start').disabled;i++)await sleep(50);assert(!win.document.querySelector('#start').disabled,'模型预热超时');
 now=win.performance.now();renderFrames(2);
 assert(win.document.body.classList.contains('touch')===mobile,'操作分支与检查尺寸不符');
}
function setup(biome){
 g.menu();win.qaSeed();g.select('silver',biome,0);win.qaSeed();g.start();
 g.world.obstacles.length=0;g.world.patches.length=0;g.world.sites.length=0;g.player.attack=10000;g.player.inv=10000;faceTestLane();
}
function faceTestLane(mode='third'){
 g.adventureCamera.yaw=0;g.adventureCamera.pitch=mode==='first'?-.08:-.25;g.adventureCamera._ready=false;g.setView(mode);renderFrames(2);
}
function assertVisible(e,label){
 const p=new Vector3(e.x,(e.y||0)+.8,e.z).project(g.camera);
 assert(p.z>-1&&p.z<1&&Math.abs(p.x)<.9&&Math.abs(p.y)<.9,label+'必须位于画面内 '+JSON.stringify({x:p.x,y:p.y,z:p.z}));return p;
}
function clearEnemies(){for(const e of g.enemies){e.xp=0;g.hurtEnemy(e,999999);}step();}
function spawn(role,x,z){const e=g.spawn(role,x,z);assert(e,'无法生成 '+role);e.speed=0;e.cool=0;return e;}
function checkBiome(biome){
 setup(biome);const origin={x:g.player.x,z:g.player.z},heavy=spawn('golem',origin.x,origin.z+2.1);const heavyScreen=assertVisible(heavy,'重怪');step();assert(heavy.wind>0,'重怪未开始蓄力');
 const angle=heavy.attackAngle,locked={x:heavy.tx,z:heavy.tz};g.player.x+=6;
 until(()=>heavy.recovery>0,'重击没有进入收招');assert(heavy.recovery>=.8,'重击反击窗口过短');
 assert(heavy.tx===locked.x&&heavy.tz===locked.z,'蓄力落点追随玩家改变');
 const frozen={x:heavy.x,z:heavy.z,recovery:heavy.recovery,time:g.time};g.pause();g.step(2);assert(heavy.recovery===frozen.recovery&&g.time===frozen.time,'暂停消耗反击窗口');g.resume();
 advance(.25);assert(Math.hypot(heavy.x-frozen.x,heavy.z-frozen.z)<.001,'重怪收招时滑动');
 assert(Math.abs(Math.atan2(Math.sin(heavy.mesh.rotation.y-angle),Math.cos(heavy.mesh.rotation.y-angle)))<.06,'重怪收招时转身追踪玩家');
 if(biome==='sand'){
  g.player.x=heavy.x+Math.sin(angle)*1.6;g.player.z=heavy.z+Math.cos(angle)*1.6;
  const hp=heavy.hp;g.hurtEnemy(heavy,10,false);assert(Math.abs(hp-heavy.hp-10)<1e-6,'盾卫收招时仍保持正面护盾');
 }
 clearEnemies();Object.assign(g.player,origin);faceTestLane();const flanker=spawn('wolf',origin.x,origin.z+2.6);const flankerScreen=assertVisible(flanker,'侧袭怪');step();assert(flanker.wind>0,'侧袭怪未开始蓄力');g.player.x+=6;
 until(()=>flanker.landRecover>0,'扑击没有落地');assert(flanker.pounceMissed&&flanker.landRecover>=.6,'扑空后没有反击窗口');
 const recovery=flanker.landRecover;g.pause();g.step(1);assert(flanker.landRecover===recovery,'暂停消耗扑空收招');g.resume();
 clearEnemies();Object.assign(g.player,origin);
 // Landscape entry cameras face each map's vista. Explicitly face the two
 // casters so portrait clipping cannot turn this into an offscreen-AI test.
 faceTestLane('first');
 const left=spawn('spitter',origin.x-.8,origin.z+7),right=spawn('spitter',origin.x+.8,origin.z+7);
 const projections=[left,right].map(e=>assertVisible(e,'远程怪'));
 assert(left!==right&&Math.hypot(left.x-right.x,left.z-right.z)>1,'两名远程怪须保留独立站位');
 until(()=>Number.isFinite(left.attackStartedAt)&&Number.isFinite(right.attackStartedAt),'远程怪没有分批出手');
 const gap=Math.abs(left.attackStartedAt-right.attackStartedAt);assert(gap>=.38-1e-8,'两名远程怪在同一拍蓄力');
 // Exercise actual walking at native speeds, rather than just helper outputs.
 const settled=[];
 for(const role of['wolf','spitter','shaman']){
  clearEnemies();Object.assign(g.player,origin);faceTestLane('first');
  const e=spawn(role,origin.x,origin.z+(role==='wolf'?3:8));e.speed=ENEMIES[e.kind].speed;e.cool=20;
  const start={x:e.x,z:e.z};advance(3.5);const at={x:e.x,z:e.z};advance(.5);
  const travelled=Math.hypot(at.x-start.x,at.z-start.z),drift=Math.hypot(e.x-at.x,e.z-at.z);
  assert(travelled>.25&&travelled<3,role+' 没有完成短距离侧移 '+travelled);
  assert(drift<.10,role+' 抵达侧位后仍在持续绕圈 '+drift);
  const pauseAt={x:e.x,z:e.z,cool:e.cool};g.pause();g.step(1);assert(e.x===pauseAt.x&&e.z===pauseAt.z&&e.cool===pauseAt.cool,'暂停改变侧位或冷却');g.resume();
  settled.push({kind:e.kind,travelled,drift});
 }
 assert(!win.qaErrors.length,win.qaErrors.join('\n'));g.pause();faceTestLane();
 return{settled,heavy:heavy.kind,heavyRecovery:frozen.recovery,heavyScreenX:heavyScreen.x,flanker:flanker.kind,missedRecovery:recovery,flankerScreenX:flankerScreen.x,castGap:gap,casterScreenX:projections.map(p=>p.x),controls:win.document.body.classList.contains('touch')?'touch':'desktop',width:win.innerWidth,height:win.innerHeight};
}
const dimensions={desktop:{width:1440,height:900,mobile:false},landscape:{width:844,height:390,mobile:true},portrait:{width:390,height:844,mobile:true}};
async function run(ids){
 buttons(true);results.length=0;errors.length=0;publish();
 try{for(const id of ids){$('#status').textContent='准备 '+id;await load(dimensions[id]);
  for(const biome of Object.keys(MAP_ROSTERS)){
   const name=id+' / '+biome;$('#status').textContent='检查 '+name;await sleep(0);
   try{results.push({name,pass:true,detail:checkBiome(biome)});}catch(error){results.push({name,pass:false,error:error.message});}publish();
  }
 }}catch(error){results.push({name:'初始化',pass:false,error:error.message});}
 errors.push(...(win?.qaErrors||[]));publish();buttons(false);
 $('#status').textContent=results.every(result=>result.pass)&&!errors.length?'全部 '+results.length+' 组通过（手机尺寸模拟）':'有检查失败，请查看报告';
}
for(const id of Object.keys(dimensions))$('#'+id).onclick=()=>run([id]);$('#all').onclick=()=>run(Object.keys(dimensions));
try{await load(dimensions.desktop);buttons(false);$('#status').textContent='准备完成。点击按钮检查真实战斗流程。';}catch(error){$('#status').textContent='加载失败：'+error.message;}
</script></html>
