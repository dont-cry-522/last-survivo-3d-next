import * as T from'../vendor/three.module.js';
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms)),assert=(v,n)=>{if(!v)throw Error(n);};
const pixelButton=document.createElement('button');pixelButton.id='pixels';pixelButton.disabled=true;pixelButton.textContent='深度解析像素诊断';$('#gpu').after(pixelButton);
const pixelCaptures=document.createElement('div');pixelCaptures.id='pixel-captures';$('#capture').after(pixelCaptures);
const html=await(await fetch('../index.html')).text(),css=await(await fetch('../style.css')).text();let frame,g,win,now=0;const results=[],errors=[];
function step(n=1,ms=1000/60){for(let i=0;i<n;i++)win.qaFrame(now+=ms);}
function publish(){document.querySelector('#report').textContent=JSON.stringify({results,errors},null,2);}
async function load(mobile=false,width=1180,height=720){
 if(g){errors.push(...win.qaErrors);g.audio.stopMusic();g.cinema?.dispose();g.renderer.dispose();g.renderer.forceContextLoss();}frame?.remove();
 frame=document.createElement('iframe');frame.title='真实游戏环境预览';frame.style.width=width+'px';frame.style.height=height+'px';$('#view').append(frame);
 const boot=`<base href="../"><script>
 window.qaErrors=[];addEventListener('error',e=>qaErrors.push(e.message));addEventListener('unhandledrejection',e=>qaErrors.push(String(e.reason)));
 const log=console.error.bind(console);console.error=(...a)=>{qaErrors.push(a.map(String).join(' '));log(...a)};
 let seed=522;window.qaSeed=()=>seed=522;Math.random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
 window.requestAnimationFrame=cb=>{window.qaFrame=cb;return 0};
 const data=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>data.get(k)??null,setItem:(k,v)=>data.set(k,String(v)),removeItem:k=>data.delete(k)}});
 const media=matchMedia.bind(window);window.matchMedia=q=>q.includes('pointer:coarse')||q.includes('pointer: coarse')?{matches:${mobile},media:q,addEventListener(){},removeEventListener(){}}:media(q);
 <\/script>`;
 frame.srcdoc=html.replace('<head>','<head>'+boot);win=frame.contentWindow;
 for(let i=0;i<600&&!win.game3d;i++)await sleep(50);assert(win.game3d,'加载超时');g=win.game3d;assert(await g.surfaceReady,'本地土石材质未全部加载');g.audio.init=async()=>true;const render=g.renderer.render.bind(g.renderer);g.renderer.render=(scene,camera)=>{if(scene!==g.hero.parent)return render(scene,camera);win.qaCamera=camera;if(g.state==='menu'&&win.document.querySelector('#preview-detail').getAttribute('aria-pressed')!=='true'){
 const box=new T.Box3().setFromObject(g.hero,true);if(g.companionMesh)box.union(new T.Box3().setFromObject(g.companionMesh,true));const rect=win.document.querySelector('#hero-preview').getBoundingClientRect();let max=0;
 for(const x of[box.min.x,box.max.x])for(const y of[box.min.y,box.max.y])for(const z of[box.min.z,box.max.z]){const v=new T.Vector3(x,y,z).project(camera),px=(v.x+1)*win.innerWidth/2,py=(1-v.y)*win.innerHeight/2;max=Math.max(max,Math.abs((px-rect.left)/rect.width*2-1),Math.abs((py-rect.top)/rect.height*2-1));}win.qaFraming=max;
 }return render(scene,camera);};
 if(mobile){const s=win.document.createElement('style');s.textContent=css.replaceAll(/\(pointer:\s*coarse\)/g,'(min-width:0px)');win.document.head.append(s);}
 now=win.performance.now();step(2);
}
function select(map,hero='silver',battle=false){g.menu();win.qaSeed();g.select(hero,map,0);if(battle){win.qaSeed();g.start();g.player.inv=9999;g.player.attack=9999;}step(12);}
function spellBattle(){
 select('forest','scout',true);g.world.obstacles=[];g.world.patches=[];g.player.inv=9999;
 const {x,z}=g.player,events=[],v=g.vfx,originals={};
 for(let i=0;i<3;i++){const e=g.spawn('golem',x+(i-1)*2,z+2.5);assert(e,'生成技能标靶失败');e.hp=e.maxHp=10000;e.speed=0;e.cool=999;}
 for(const id of ['fire','ice','storm']){g.player.upgrades[id]=1;g.player.spell[id]=0;}
 for(const id of ['fire','ice','lightning']){originals[id]=v[id];v[id]=function(...args){events.push(id);return originals[id].apply(v,args);};}
 try{step(70);for(const id of Object.keys(originals))assert(events.includes(id),'实战没有触发 '+id);assert(g.enemies.some(e=>e.hp<e.maxHp),'实战技能未结算伤害');const r=reportFrame();
  v.fire(x,z,2.5,true);step(2);g.pause();const life=v.active.map(p=>[p.life,p.delay]);step(30);assert(JSON.stringify(v.active.map(p=>[p.life,p.delay]))===JSON.stringify(life),'暂停仍在推进特效');g.menu();assert(v.active.length===0,'退出未清理特效');return{events:[...new Set(events)],limit:v.limit,...r};
 }finally{for(const id of Object.keys(originals))v[id]=originals[id];}
}
async function check(name,fn){$('#status').textContent=name;try{results.push({name,pass:true,detail:await fn()});}catch(e){results.push({name,pass:false,error:e.message});}publish();await sleep(0);}
function reportFrame(){const r=g.renderer;assert(!win.qaErrors.length,win.qaErrors.join('\n'));assert(r.info.programs.every(p=>p.diagnostics?.runnable!==false),'GPU 着色器未通过');assert(r.getContext().getError()===0,'WebGL 错误');return{calls:r.info.render.calls,triangles:r.info.render.triangles,geometries:r.info.memory.geometries,textures:r.info.memory.textures,pixels:r.domElement.width*r.domElement.height};}
function pixelDifference(a,b,width){
 let pixels=0,channels=0,maxDelta=0,total=0,minX=Infinity,minY=Infinity,maxX=-1,maxY=-1;const examples=[];
 for(let i=0;i<a.length;i+=4){let changed=false;for(let c=0;c<4;c++){const delta=Math.abs(a[i+c]-b[i+c]);if(delta){changed=true;channels++;total+=delta;maxDelta=Math.max(maxDelta,delta);}}
  if(changed){pixels++;const x=i/4%width,y=Math.floor(i/4/width);minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);if(examples.length<4)examples.push({x,y,before:[...a.slice(i,i+4)],after:[...b.slice(i,i+4)]});}
 }
 return{pixels,channels,maxDelta,meanAbsDelta:total/a.length,bbox:pixels?{minX,minY,maxX,maxY}:null,examples};
}
// Diagnostic only: expose exact same-mode and cross-mode deltas behind the bounded regression.
window.depthResolveDiagnostics=async({reload=true,disableLeafCutout=false}={})=>{
 if(reload){await load();select('forest','silver',true);}g.pause();
 if(!g.cinema.enabled)return{supported:false};
 const r=g.renderer,target=g.cinema.sceneTarget,gl=r.getContext(),originalBlit=gl.blitFramebuffer,masks=[],sequence=[true,true,false,false,true,false,true,false],oldResolve=target.resolveDepthBuffer,oldShadowUpdate=r.shadowMap.needsUpdate;
 const draw=()=>g.cinema.render(()=>r.render(g.hero.parent,g.camera),1),phases=[],leaves=new Map();let worst;
 gl.blitFramebuffer=function(...args){masks.push(args[8]);return originalBlit.apply(this,args);};
 const phase=(name,{warmup=0,refreshShadow=false}={})=>{
  for(let i=0;i<warmup;i++){target.resolveDepthBuffer=sequence[i%sequence.length];draw();}masks.length=0;
  const frames=[],lastMode=new Map();let previous;
  for(const resolve of sequence){
   target.resolveDepthBuffer=resolve;if(refreshShadow)r.shadowMap.needsUpdate=true;
   const shadowBefore=r.shadowMap.needsUpdate;draw();gl.finish();
   assert(r.getRenderTarget()===null,'诊断必须读取画布帧缓冲');
   const width=gl.drawingBufferWidth,height=gl.drawingBufferHeight,data=new Uint8Array(width*height*4);gl.readPixels(0,0,width,height,gl.RGBA,gl.UNSIGNED_BYTE,data);
   const png=r.domElement.toDataURL('image/png'),sample={resolve,data,png},same=lastMode.get(resolve),difference=previous?pixelDifference(previous.data,data,width):null;
   frames.push({resolve,width,height,pngLength:png.length,pngEqualPrevious:previous?previous.png===png:null,previousMode:previous?.resolve??null,difference,sameModeDifference:same?pixelDifference(same.data,data,width):null,shadowBefore,shadowAfter:r.shadowMap.needsUpdate,blitMasks:masks.splice(0),...reportFrame()});
   if(difference?.pixels&&(!worst||difference.pixels>worst.difference.pixels))worst={phase:name,before:previous,after:sample,difference};
   previous=sample;lastMode.set(resolve,sample);
  }
  phases.push({name,frames});
 };
 try{
  phase('initial');phase('warmed',{warmup:6});phase('shadow-refreshed',{warmup:2,refreshShadow:true});
  if(disableLeafCutout){
   g.world.group.traverse(o=>{if(o.userData.treeCanopy&&o.material.alphaTest>0)leaves.set(o.material,o.material.alphaTest);});
   for(const mat of leaves.keys()){mat.alphaTest=0;mat.needsUpdate=true;}r.shadowMap.needsUpdate=true;phase('without-leaf-cutout',{warmup:6});
  }
  const report={supported:true,samples:target.samples,sequence,time:g.time,coordinates:'readPixels origin is bottom-left',cutoutMaterials:leaves.size,phases};
  window.depthResolveReport=report;pixelCaptures.replaceChildren();
  if(worst)for(const [label,sample]of[['前帧',worst.before],['后帧',worst.after]]){
   const link=document.createElement('a'),img=document.createElement('img');link.href=sample.png;link.download='depth-'+label+'-'+sample.resolve+'.png';link.title=worst.phase+' '+label+' resolve='+sample.resolve;img.src=sample.png;img.alt=link.title;img.style.maxWidth='49%';link.append(img);pixelCaptures.append(link);
  }
  $('#report').textContent=JSON.stringify(report,null,2);$('#status').textContent='深度解析原始像素诊断完成 · '+phases.map(p=>p.name+': '+Math.max(...p.frames.map(f=>f.difference?.pixels||0))+' 个差异像素').join('；');return report;
 }finally{
  target.resolveDepthBuffer=oldResolve;gl.blitFramebuffer=originalBlit;
  for(const[mat,alphaTest]of leaves){mat.alphaTest=alphaTest;mat.needsUpdate=true;}r.shadowMap.needsUpdate=leaves.size?true:oldShadowUpdate;
 }
};
pixelButton.onclick=async()=>{pixelButton.disabled=true;try{await window.depthResolveDiagnostics({disableLeafCutout:true});}catch(e){$('#status').textContent='像素诊断失败：'+e.message;}finally{pixelButton.disabled=false;}};
$('#run').onclick=async()=>{
 for(const b of document.querySelectorAll('button'))b.disabled=true;results.length=0;errors.length=0;
 try{
  await load();const ids=['forest','snow','ash','sand','coast','confluence'],memory={};
  for(let cycle=0;cycle<3;cycle++)for(const id of ids)await check(id+' 大厅/战斗 '+(cycle+1),()=>{
   const owned=[];g.world.group.traverse(o=>{if(o.userData.ownedGeometry)owned.push(o.geometry);});const released=new Set();for(const geometry of owned)geometry.addEventListener('dispose',()=>released.add(geometry));
   select(id);assert(owned.every(geometry=>released.has(geometry)),'切图未回收远景/遗迹几何');const lobby=reportFrame();assert(win.qaFraming<.99,'大厅人物被裁切 '+win.qaFraming);assert(g.world.lobbyView,'大厅没有地图取景');assert(Math.hypot(g.player.x-g.world.lobbyView.x,g.player.z-g.world.lobbyView.z)<.001,'大厅未站在展示位');win.qaSeed();g.start();assert(Math.hypot(g.player.x-g.world.spawn.x,g.player.z-g.world.spawn.z)<.001,'展示位泄漏到实战出生点');g.player.inv=9999;g.player.attack=9999;step(24);const battle=reportFrame();assert(battle.pixels<=3200000,'电脑像素预算超限');
   if(cycle===1)memory[id]=battle;if(cycle===2){assert(battle.geometries<=memory[id].geometries+2,'同地图重建几何资源持续增长');assert(battle.textures<=memory[id].textures,'同地图重建纹理资源增长');}
   return{lobby,battle};

   select(id,'silver',true);const pond=g.world.ponds[0];assert(pond,'没有可预览的水岸');g.player.x=pond.x+pond.rx+1.5;g.player.z=pond.z;step(100);const initial=reportFrame();step(60);const flowing=reportFrame();assert(flowing.textures===initial.textures,'流水逐帧创建纹理');g.pause();const time=g.time;step(60);assert(g.time===time,'暂停推进游戏时间');g.resume();step(2);return flowing;
  });
  for(const hero of ['scout','silver','wraith','tide','lingya','wuling','mirage'])await check(hero+' 材质与武器',()=>{select('forest',hero);assert(win.qaFraming<.99,'角色或伙伴被裁切 '+win.qaFraming);return reportFrame();});
  await check('近景草簇的游戏时间、暂停和资源预算',()=>{select('forest','silver',true);const group=g.world.adventureGroundDetail,shader={uniforms:{},vertexShader:'#include <begin_vertex>'};group.children[0].material.onBeforeCompile(shader);assert(group.children.length<=2,'近景地被绘制批次超限');const triangles=group.children.reduce((n,b)=>n+b.count*(b.geometry.index?.count??b.geometry.attributes.position.count)/3,0);assert(triangles<=55000,'近景地被网格超限');const clock=shader.uniforms.groundWindTime;const t=clock.value;step(15);assert(clock.value>t,'草簇没有随游戏时间摆动');g.pause();const paused=clock.value;step(30);assert(clock.value===paused,'暂停仍在推动草叶风');g.resume();step();assert(clock.value>paused,'继续后草叶仍冻结');return{triangles,...reportFrame()};});
  await check('电脑实战法术触发、暂停与回收',()=>spellBattle());
  await check('新探索内容的实战奖励、暂停、战斗阻断与重开',()=>{
   select('forest','silver',true);g.player.level=20;g.player.xp=0;
   const trail=g.world.discoveries.find(n=>n.variant==='trail');assert(trail,'没有寻迹');trail.availableAt=0;
   const end=trail.nodes[2];g.player.x=end.x;g.player.z=end.z;step();assert(trail.progress===0,'允许跳过前段');
   for(const node of trail.nodes){g.player.x=node.x;g.player.z=node.z;step();}
   assert(trail.claimed&&g.player.xp===24,'寻迹经验未接实战结算');step(3);assert(g.player.xp===24,'重复领取寻迹');
   const cache=g.world.discoveries.find(n=>n.variant==='cache');assert(cache,'没有补给');cache.availableAt=0;g.player.x=cache.x;g.player.z=cache.z;g.player.hp=50;step(30);const progress=cache.progress;g.pause();step(30);assert(cache.progress===progress,'暂停仍整理补给');g.resume();step(85);
   assert(cache.claimed&&g.player.xp===44,'补给经验结算错误');assert(g.player.hp===50+Math.ceil(g.player.maxHp*.08),'补给治疗错误');step(3);assert(g.player.xp===44,'重复领取补给');assert(cache.markers.every(m=>!m.visible)&&cache.mesh.visible,'领取后景物或标记不正确');
   select('forest','silver',true);assert(g.world.discoveries.every(n=>!n.claimed&&n.progress===0),'重开残留领取状态');
   const fresh=g.world.discoveries.find(n=>n.variant==='trail'),last=fresh.nodes[2];fresh.availableAt=0;fresh.progress=2;g.player.x=last.x;g.player.z=last.z;const dx=last.x-fresh.x,dz=last.z-fresh.z,d=Math.hypot(dx,dz);const enemy=g.spawn('golem',last.x+dx/d*2.6,last.z+dz/d*2.6);assert(enemy,'敌人生成失败');enemy.speed=0;enemy.cool=999;step();assert(!fresh.claimed&&fresh.contested,'终点附近敌人未阻止领取');return reportFrame();
  });
  await check('高画质保留深度遮挡、免解析深度且画面一致',()=>{
   select('forest','silver',true);g.pause();if(!g.cinema.enabled)return{supported:false};const target=g.cinema.sceneTarget,gl=g.renderer.getContext(),masks=[],original=gl.blitFramebuffer;
   gl.blitFramebuffer=function(...args){masks.push(args[8]);return original.apply(this,args);};
   const draw=()=>g.cinema.render(()=>g.renderer.render(g.hero.parent,g.camera),1);
   const width=gl.drawingBufferWidth,height=gl.drawingBufferHeight,read=()=>{const data=new Uint8Array(width*height*4);gl.readPixels(0,0,width,height,gl.RGBA,gl.UNSIGNED_BYTE,data);return data;};

  });

};

$('#lobby').onclick=()=>preview();$('#battle').onclick=()=>preview(true);$('#mobile').onclick=()=>preview(true,true);
$('#paths').onclick=()=>{for(const site of g.world.sites)site.trail.visible=!site.trail.visible;step();};
$('#ruins').onclick=async()=>{if(!['forest','confluence'].includes($('#map').value))$('#map').value='forest';await preview(true);const a=g.world.forestVista?.gateCenter||g.world.forestVista?.anchors?.[0];if(!a){$('#status').textContent='当前地形没有可用古迹锚点';return;}let p={x:a.x,z:a.z+5};for(const dz of [5,6,7,-5,-6])if(g.world.obstacles.every(o=>Math.hypot(a.x-o.x,a.z+dz-o.z)>o.r+.7)){p={x:a.x,z:a.z+dz};break;}g.player.x=p.x;g.player.z=p.z;step(90);$('#status').textContent='林中古迹实景 · '+JSON.stringify({columns:g.world.forestVista.columns,arches:g.world.forestVista.arches,triangles:g.world.forestVista.triangles,drawCalls:g.world.forestVista.drawCalls,anchors:g.world.forestVista.anchors});};

for(const variant of ['cache','trail'])$('#'+variant).onclick=async()=>{await preview(true);const n=g.world.discoveries.find(n=>n.variant===variant);if(!n){$('#status').textContent='此种子没有可用的 '+variant;return;}n.availableAt=0;g.player.x=n.x;g.player.z=n.z+3.8;g.adventureCamera.yaw=Math.PI;g.adventureCamera.pitch=-.35;g.adventureCamera._ready=false;step(30);$('#status').textContent='实际探索景物 · '+JSON.stringify({biome:n.id,variant:n.variant,position:{x:n.x,z:n.z},nodes:n.nodes,...reportFrame()});};
$('#gpu').onclick=async()=>{
 $('#gpu').disabled=true;await load(false,2560,1440);select('forest','silver',true);g.pause();const gl=g.renderer.getContext(),ext=gl.getExtension('EXT_disjoint_timer_query_webgl2'),target=g.cinema.sceneTarget;
 try{if(!ext||!target?.samples){$('#status').textContent='当前浏览器不支持 GPU 耗时对照';return;}
  const draw=()=>g.cinema.render(()=>g.renderer.render(g.hero.parent,g.camera),1),measure=async old=>{target.resolveDepthBuffer=old;const q=gl.createQuery();gl.beginQuery(ext.TIME_ELAPSED_EXT,q);draw();gl.endQuery(ext.TIME_ELAPSED_EXT);gl.flush();for(let i=0;i<300&&!gl.getQueryParameter(q,gl.QUERY_RESULT_AVAILABLE);i++)await sleep(10);const ready=gl.getQueryParameter(q,gl.QUERY_RESULT_AVAILABLE),disjoint=gl.getParameter(ext.GPU_DISJOINT_EXT),ms=ready&&!disjoint?gl.getQueryParameter(q,gl.QUERY_RESULT)/1e6:null;gl.deleteQuery(q);return ms;};
  for(let i=0;i<5;i++)draw();gl.finish();const old=[],current=[];for(let cycle=0;cycle<4;cycle++)for(const mode of (cycle%2?[false,true]:[true,false])){const value=await measure(mode);if(value!==null)(mode?old:current).push(value);}
  const median=a=>{const b=[...a].sort((a,b)=>a-b);return b.length?(b[Math.floor((b.length-1)/2)]+b[Math.ceil((b.length-1)/2)])/2:null;};$('#status').textContent='同机位 GPU 单帧对照（非真机游戏 FPS） · '+JSON.stringify({old,current,oldMedianMs:median(old),currentMedianMs:median(current),...reportFrame()});
 }finally{if(target)target.resolveDepthBuffer=false;$('#gpu').disabled=false;}
};
$('#water').onclick=()=>{const pond=g.world.ponds[0];if(!pond)return;g.start();g.player.inv=9999;g.player.attack=9999;g.player.x=pond.x+pond.rx+1.5;g.player.z=pond.z;step(100);$('#status').textContent='水岸实景';};
await load();for(const b of document.querySelectorAll('button'))b.disabled=false;$('#status').textContent='准备完成';
</script></html>
