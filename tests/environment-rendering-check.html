$('#ruins').onclick=async()=>{if(!['forest','confluence'].includes($('#map').value))$('#map').value='forest';await preview(true);const a=g.world.forestVista?.gateCenter||g.world.forestVista?.anchors?.[0];if(!a){$('#status').textContent='当前地形没有可用古迹锚点';return;}let p={x:a.x,z:a.z+5};for(const dz of [5,6,7,-5,-6])if(g.world.obstacles.every(o=>Math.hypot(a.x-o.x,a.z+dz-o.z)>o.r+.7)){p={x:a.x,z:a.z+dz};break;}g.player.x=p.x;g.player.z=p.z;step(90);$('#status').textContent='林中古迹实景 · '+JSON.stringify({columns:g.world.forestVista.columns,arches:g.world.forestVista.arches,triangles:g.world.forestVista.triangles,drawCalls:g.world.forestVista.drawCalls,anchors:g.world.forestVista.anchors});};

for(const variant of ['cache','trail'])$('#'+variant).onclick=async()=>{await preview(true);const n=g.world.discoveries.find(n=>n.variant===variant);if(!n){$('#status').textContent='此种子没有可用的 '+variant;return;}n.availableAt=0;g.player.x=n.x;g.player.z=n.z+3.8;g.adventureCamera.yaw=Math.PI;g.adventureCamera.pitch=-.35;g.adventureCamera._ready=false;step(30);$('#status').textContent='实际探索景物 · '+JSON.stringify({biome:n.id,variant:n.variant,position:{x:n.x,z:n.z},nodes:n.nodes,...reportFrame()});};
$('#gpu').onclick=async()=>{
 $('#gpu').disabled=true;await load(false,2560,1440);select('forest','silver',true);g.pause();const gl=g.renderer.getContext(),ext=gl.getExtension('EXT_disjoint_timer_query_webgl2'),target=g.cinema.sceneTarget;
 try{if(!ext||!target?.samples){$('#status').textContent='当前浏览器不支持 GPU 耗时对照';return;}
  const draw=()=>g.cinema.render(()=>g.renderer.render(g.hero.parent,g.camera),1),measure=async old=>{target.resolveDepthBuffer=old;const q=gl.createQuery();gl.beginQuery(ext.TIME_ELAPSED_EXT,q);draw();gl.endQuery(ext.TIME_ELAPSED_EXT);gl.flush();for(let i=0;i<300&&!gl.getQueryParameter(q,gl.QUERY_RESULT_AVAILABLE);i++)await sleep(10);const ready=gl.getQueryParameter(q,gl.QUERY_RESULT_AVAILABLE),disjoint=gl.getParameter(ext.GPU_DISJOINT_EXT),ms=ready&&!disjoint?gl.getQueryParameter(q,gl.QUERY_RESULT)/1e6:null;gl.deleteQuery(q);return ms;};
  for(let i=0;i<5;i++)draw();gl.finish();const old=[],current=[];for(let cycle=0;cycle<4;cycle++)for(const mode of (cycle%2?[false,true]:[true,false])){const value=await measure(mode);if(value!==null)(mode?old:current).push(value);}
  const median=a=>{const b=[...a].sort((a,b)=>a-b);return b.length?(b[Math.floor((b.length-1)/2)]+b[Math.ceil((b.length-1)/2)])/2:null;};$('#status').textContent='同机位 GPU 单帧对照（非真机游戏 FPS） · '+JSON.stringify({old,current,oldMedianMs:median(old),currentMedianMs:median(current),...reportFrame()});
 }finally{if(target)target.resolveDepthBuffer=false;$('#gpu').disabled=false;}
};
$('#water').onclick=()=>{const pond=g.world.ponds[0];if(!pond)return;g.start();g.player.inv=9999;g.player.attack=9999;g.player.x=pond.x+pond.rx+1.5;g.player.z=pond.z;step(100);$('#status').textContent='水岸实景';};
await load(initialSize==='mobile',initialSize==='mobile'?844:1180,initialSize==='mobile'?390:720);for(const b of document.querySelectorAll('button'))b.disabled=false;$('#status').textContent='准备完成'+(singleSizeBatch?' · 当前尺寸 20 组模式':'');
</script></html>
