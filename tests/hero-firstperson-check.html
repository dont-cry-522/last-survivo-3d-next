<!doctype html><meta charset="utf-8"><title>七英雄第一人称衣装与持握</title>
<style>body{background:#17262b;color:#e1e7e2;font:14px system-ui}canvas{max-width:100%;height:auto}pre{white-space:pre-wrap}a{color:#b6ddcf}</style>
<h1>第一人称 · 待机 / 出手 / 收招</h1><p>正式角色武器、相同光照与70度视角。衣袖切口不同，原有双手接触点保留。</p><p id="status">载入中</p><a id="save-png">保存画面</a><div id="sheet"></div><pre id="report"></pre>
<section><h2>三人连续动作</h2><p>以实际基础射速连续推进角色与第一人称动作，检查待机、准备、释放前后、回收。此页是动作验证场景，不进行伤害或碰撞结算；铃芽按实际拉带、释弹与收手时钟推进。</p><button id="motion-check" disabled>播放并生成三人动作对比</button><p id="motion-status">等待默认检查完成</p><div id="motion-live"></div><div id="motion-sheet"></div><p><a id="motion-save-png">保存动作画面</a> · <a id="motion-save-json">保存动作报告</a></p><pre id="motion-report"></pre></section>
<script type="module">
import * as T from '../vendor/three.module.js';
import {actor,animateActor} from '../world.js?v=202';
import {FirstPersonView} from '../first-person-view.js?v=202';
import {WEAPON_RECOVERY,mirageShotDelay} from '../weapon-performance.js?v=202';
import {weaponStats} from '../rules.js';
import {POISON} from '../poison-config.js';
const source=await(await fetch('../world.js',{cache:'no-store'})).text(),entry=source.match(/from['"](.\/skinned-hero\.js[^'"]*)['"]/)[1];
const {loadHeroAssets,disposeHero}=await import(new URL('../'+entry,location.href));
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}),scene=new T.Scene(),camera=new T.PerspectiveCamera(70,16/9,.02,80),view=new FirstPersonView(camera),errors=[],results=[];
addEventListener('error',e=>errors.push(e.message));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
renderer.setSize(384,216);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;scene.background=new T.Color(0x526773);scene.add(camera);camera.layers.enable(1);
const sky=new T.HemisphereLight(0x9cabb9,0x394a3f,1.3),sun=new T.DirectionalLight(0xffe0b5,3.4);sun.position.set(-8,14,10);sky.layers.enable(1);sun.layers.enable(1);scene.add(sky,sun);
const shadowOnly=new URLSearchParams(location.search).has('shadow'),remaining=new URLSearchParams(location.search).has('remaining'),tideOnly=new URLSearchParams(location.search).has('tide');
const remainingWeapons=[['游侠 · 步枪','scout','rifle'],['游侠 · 霰弹','scout','shotgun'],['游侠 · 火杖','scout','fire'],['霜影 · 短弩','silver','crossbow'],['霜影 · 月刃','silver','shuriken'],['霜影 · 暗杖','silver','dark'],['影裔 · 幽裂','wraith','shade'],['影裔 · 战镰','wraith','shadowblade'],['影裔 · 魔典','wraith','grimoire'],['潮行者 · 长叉','tide','harpoon']];
const motionWeapons=tideOnly?[['潮行者 · 长叉','tide','harpoon']]:remaining?remainingWeapons:shadowOnly?[['影裔 · 牵影咒','wraith','shade']]:[['铃芽','lingya','boomerang'],['雾苓','wuling','sporelantern'],['蜃影','mirage','miasmalantern']];
if(remaining){document.querySelector('section h2').textContent='四位英雄 · 十种武器连续动作';document.querySelector('section p').textContent='按实际基础射速推进正式双手及机件，连续检查待机、出手、余势、回装和归位。阶段采样不等于伤害触发时刻；伤害时钟保持原系统。';document.querySelector('#motion-check').textContent='播放并生成四位十武器动作';}
if(shadowOnly){document.querySelector('section h2').textContent='影裔 · 牵影咒连续动作';document.querySelector('section p').textContent='按真实出手周期检查托掌、聚指、推出和回收，模型与游戏相同。';document.querySelector('#motion-check').textContent='播放并生成牵影咒动作';}
const kinds=tideOnly?[['潮行者 · 长叉','tide','harpoon']]:remaining?remainingWeapons:shadowOnly?[['牵影咒','wraith','shade'],['战镰','wraith','shadowblade'],['魔典','wraith','grimoire']]:[['游侠','scout','rifle'],['霜影','silver','crossbow'],['影裔','wraith','shadowblade'],['潮行者','tide','harpoon'],['铃芽','lingya','boomerang'],['雾苓','wuling','sporelantern'],['蜃影','mirage','miasmalantern']];
const sheet=document.createElement('canvas');sheet.width=1152;sheet.height=kinds.length*246;document.querySelector('#sheet').append(sheet);const ctx=sheet.getContext('2d');ctx.fillStyle='#17262b';ctx.fillRect(0,0,sheet.width,sheet.height);
await loadHeroAssets();
for(const [row,[label,kind,weapon]]of kinds.entries()){
 const model=actor(kind,weapon);if(!model.userData.skinned)throw Error('Missing actual hero: '+kind);view.setHero(model,weapon);
 for(const [column,phase]of [1,.25,.65].entries()){
  for(let f=0;f<45;f++){const d=model.userData,age=column?phase*WEAPON_RECOVERY[weapon]:2;d.aimActive=column>0;d.shotSerial=column;d.reloadDuration=1;d.attackAge=age;d.reloadPhase=column?age:1;animateActor(model,3+column+f/60,0,column===1?.15:0);d.attackAge=age;view.update(3+column+f/60,1/60,{visible:true,attack:column===1?.15:0,attackDuration:1});}
  renderer.render(scene,camera);ctx.drawImage(renderer.domElement,column*384,row*246);ctx.fillStyle='#e1e7e2';ctx.font='15px system-ui';ctx.fillText(label+' · '+['待机','出手','收招'][column],column*384+10,row*246+237);
  results.push({kind,phase,pass:renderer.getContext().getError()===0&&renderer.info.programs.every(p=>p.diagnostics?.runnable!==false),calls:renderer.info.render.calls,triangles:renderer.info.render.triangles});
 }
 view.clear();disposeHero(model);await new Promise(r=>setTimeout(r,0));
}
document.querySelector('#status').textContent=results.every(r=>r.pass)&&!errors.length?'完成：'+kinds.length+' 套武器第一人称 '+results.length+' 个画面':'失败';document.querySelector('#report').textContent=JSON.stringify({results,errors},null,2);const link=document.querySelector('#save-png');link.href=sheet.toDataURL('image/png');link.download='hero-firstperson-check.png';view.dispose();renderer.dispose();
const motionButton=document.querySelector('#motion-check');motionButton.disabled=false;document.querySelector('#motion-status').textContent='可以开始；默认报告保持不变';
motionButton.onclick=async()=>{
 motionButton.disabled=true;const status=document.querySelector('#motion-status'),startErrors=errors.length,motionResults=[],timelines=[];
 const live=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}),motionView=new FirstPersonView(camera),motionSheet=document.createElement('canvas');let model=null;
 live.setSize(384,216);live.toneMapping=T.ACESFilmicToneMapping;live.toneMappingExposure=1.05;document.querySelector('#motion-live').replaceChildren(live.domElement);
 motionSheet.width=5*384;motionSheet.height=motionWeapons.length*270;const context=motionSheet.getContext('2d');context.fillStyle='#17262b';context.fillRect(0,0,motionSheet.width,motionSheet.height);document.querySelector('#motion-sheet').replaceChildren(motionSheet);
 const step=1/120,point=new T.Vector3(),nextPaint=()=>new Promise(resolve=>requestAnimationFrame(resolve));
 try{
  for(const [row,[label,kind,weapon]]of motionWeapons.entries()){
   const w=weaponStats({weaponId:weapon}),period=1/w.rate,duration=Math.min(WEAPON_RECOVERY[weapon],Math.max(.12,period*.9));
   const release=weapon==='sporelantern'?Math.min(POISON.castRecovery,.9/w.rate)*POISON.releaseFraction:weapon==='miasmalantern'?mirageShotDelay(w.rate):Math.min(.55,.9/w.rate)*.24;
   const stages=remaining?[['待机',-1],['出手',duration*.18],['余势',duration*.45],['回装',Math.max(duration*.75,period*.55)],['归位',Math.max(duration+.08,period*.93)]]:[['待机',-1],['准备',release*.45],['释放前',release-step],['释放后',release+step],['回收',duration+.08]];
   timelines.push({kind,weapon,rate:w.rate,period,release,duration});
   model=actor(kind,weapon);if(!model.userData.skinned)throw Error('Missing actual hero: '+kind);const d=model.userData;motionView.setHero(model,weapon);d.reloadDuration=period;d.shotSerial=0;d.aimActive=false;
   let elapsed=0,captured=0,previousAge=-step;
   const capture=(name,requestedAge)=>{
    const weaponVisible=motionView.weapon.visible,pod=d.sporePod,values=[];
    for(const hand of motionView.hands){hand.getWorldPosition(point);values.push({position:point.toArray(),open:hand.morphTargetInfluences[0],visible:hand.visible});}
    const pass=live.getContext().getError()===0&&live.info.programs.every(p=>p.diagnostics?.runnable!==false)&&values.every(h=>h.position.every(Number.isFinite)&&Number.isFinite(h.open));
    context.drawImage(live.domElement,captured*384,row*270);context.fillStyle='#e1e7e2';context.font='15px system-ui';context.fillText(label+' · '+name,captured*384+10,row*270+237);context.font='12px system-ui';context.fillText('动作 '+d.attackAge.toFixed(4)+' s / 周期 '+period.toFixed(4)+' s',captured*384+10,row*270+257);
    motionResults.push({kind,weapon,stage:name,requestedAge,attackAge:d.attackAge,reloadPhase:d.reloadPhase,releaseAt:release,weaponVisible,sourceVisible:d.gun.visible,sourcePodVisible:pod?.visible??null,boomerangAway:!!d.boomerangAway,catchReady:d.catchReady||0,catchTime:d.catchTime||0,hands:values,pass,calls:live.info.render.calls,triangles:live.info.render.triangles});captured++;
   };
   // Settle the actual idle once. Subsequent shots use one serial change and a
   // continuous clock, never repeated assignments that freeze a pose per tile.
   for(let f=0;f<60;f++){elapsed+=step;d.reloadPhase=1;animateActor(model,3+elapsed,0,0);motionView.update(3+elapsed,step,{visible:true,attack:0});}
   live.render(scene,camera);capture(...stages[0]);await nextPaint();
   for(let frame=0;captured<stages.length;frame++){
    const age=frame*step;elapsed+=step;d.shotSerial=1;d.aimActive=true;d.reloadPhase=Math.min(1,age/period);

    const attack=Math.max(0,.15-age);animateActor(model,3+elapsed,0,attack);motionView.update(3+elapsed,step,{visible:true,attack,attackDuration:period});live.render(scene,camera);
    status.textContent=label+' · 连续动作 '+d.attackAge.toFixed(3)+' 秒（释放 '+release.toFixed(3)+' 秒）';
    // Pre-release rounds down; post-release rounds up, so the two tiles cannot
    // accidentally show the same visibility state at a fractional frame time.
    const [name,target]=stages[captured],threshold=name==='释放前'?Math.floor(target/step)*step:target;
    if(age+1e-9>=threshold)capture(name,target);
    previousAge=age;if(frame%2===0)await nextPaint();
   }
   motionView.clear();disposeHero(model);model=null;
  }
 }catch(error){errors.push(error.stack||String(error));}
 finally{if(model){motionView.clear();disposeHero(model);}motionView.dispose();live.dispose();motionButton.disabled=false;}
 const report={fixture:'continuous-firstperson',step,timelines,results:motionResults,errors:errors.slice(startErrors)};
 const passed=motionResults.length===motionWeapons.length*5&&motionResults.every(r=>r.pass)&&!report.errors.length;status.textContent=passed?'完成：'+motionWeapons.length+' 种武器连续动作 '+motionResults.length+' 个阶段；请结合画面判断自然度':'失败：请检查下方报告';document.querySelector('#motion-report').textContent=JSON.stringify(report,null,2);
 const png=document.querySelector('#motion-save-png');png.href=motionSheet.toDataURL('image/png');png.download='hero-firstperson-continuous.png';const json=document.querySelector('#motion-save-json');json.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(report,null,2));json.download='hero-firstperson-continuous.json';
};
</script>
