<!doctype html><meta charset="utf-8"><title>蜃花灯声音检查</title>
<style>body{background:#282132;color:#eee;font:16px system-ui;padding:24px}button{padding:12px}pre{white-space:pre-wrap}</style>
<h1>蜃花灯 · 实际音频节点检查</h1><p>依次播放聚气、喷雾、湿润命中与替身散雾，然后检查取消与暂停回收。不会修改声音偏好或存档。</p>
<button id="play">播放并检查音效</button><pre id="result">等待开始</pre>
<script type="module">
import{GameAudio}from'../audio.js?v=187';import{mirageSound}from'../mirage-audio.js?v=187';
const wait=ms=>new Promise(r=>setTimeout(r,ms)),check=(v,m)=>{if(!v)throw Error(m)},report=document.querySelector('#result');
document.querySelector('#play').onclick=async()=>{const sound=new GameAudio();try{
 sound.setSfxStyle('standard',{persist:false});sound.muted=false;sound.sfxVolume=.8;check(await sound.init(),'audio context did not start');report.textContent='RUNNING';
 check(mirageSound(sound,'mirageCharge'),'no charge');check(!mirageSound(sound,'mirageCharge'),'duplicate charge gate');await wait(180);
 check(mirageSound(sound,'mirageShot'),'no shot');await wait(220);check(mirageSound(sound,'mirageBurst'),'no impact');check(!mirageSound(sound,'mirageStatus'),'DOT has impact sound');await wait(750);
 check(sound.weaponSources.size===0&&sound.proceduralSources.size===0&&sound.nodes===0,'normal sound leaked');
 check(mirageSound(sound,'mirageBloom'),'no decoy fog burst');await wait(750);
 check(sound.weaponSources.size===0&&sound.proceduralSources.size===0&&sound.nodes===0,'decoy fog burst leaked');
 check(mirageSound(sound,'mirageCharge'),'second charge');await wait(40);check(mirageSound(sound,'mirageHide'),'cancel charge');sound.stopWeapons();await wait(100);
 check(sound.weaponSources.size===0&&sound.proceduralSources.size===0&&sound.nodes===0,'cancel leaked');await wait(150);
 check(mirageSound(sound,'mirageCharge'),'restart charge');check(mirageSound(sound,'mirageBloom'),'repeat decoy fog burst');sound.reset('forest');await wait(100);
 check(sound.weaponSources.size===0&&sound.proceduralSources.size===0&&sound.nodes===0,'reset leaked');
 report.textContent='PASS: real Web Audio playback, charge/shot/burst/decoy fog separation, duplicate gate, silent DOT, natural expiry, cancel/pause/reset clean (0 active sources, 0 nodes). Listening quality still needs player judgement.';
 }catch(e){report.textContent='FAIL '+e.stack;console.error(e);}finally{sound.stopWeapons();await sound.ctx?.close();}};
</script>
