 if(g.player.weaponId==='miasmalantern'&&trace.length<75){const bullets=[...new Set([...before,...g.bullets])];trace.push({time:+g.time.toFixed(4),player:point(g.player),target:point(activeTarget),hp:activeTarget?.hp,bullets:bullets.map(b=>({position:{x:b.x,y:b.height,z:b.z},velocity:{x:b.vx,y:b.vy,z:b.vz},life:b.life,releaseDelay:b.releaseDelay,aim:b.aimPoint,removed:!g.bullets.includes(b)}))});}
 if(initial?.input&&trace.length<60&&(gunBefore.serial!==(g.hero.userData.shotSerial||0)||gunBefore.hp!==activeTarget?.hp||(activeTarget?.stagger||0)>gunBefore.stagger)){
  const bullets=[...new Set([...before,...g.bullets])];trace.push({time:g.time,serial:g.hero.userData.shotSerial,held:g.controls.held,cooldown:g.player.attack,player:point(g.player),target:activeTarget?{...point(activeTarget),id:activeTarget.id,alive:activeTarget.alive,listed:g.enemies.includes(activeTarget)||g.boss===activeTarget,hp:activeTarget.hp,stagger:activeTarget.stagger||0}:null,camera:point(g.camera.position),direction:point(g.adventureCamera.getRay().direction),bullets:bullets.map(b=>({position:{x:b.x,y:b.height,z:b.z},velocity:{x:b.vx,y:b.vy,z:b.vz},aim:b.aimPoint,origin:b.volley?{x:b.volley.x,y:b.volley.y,z:b.volley.z}:null,hits:[...b.hits],nearHits:b.volley?.hits.get(activeTarget)||0,removed:!g.bullets.includes(b)}))});

async function load(size){

 const boot=`<base href="../"><script>

 let seed=204;window.qaSeed=()=>seed=204;Math.random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
 window.requestAnimationFrame=cb=>{window.qaFrame=cb;return 0};
 const data=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>data.get(k)??null,setItem:(k,v)=>data.set(k,String(v)),removeItem:k=>data.delete(k)}});
 const media=matchMedia.bind(window);window.matchMedia=q=>q.includes('pointer:coarse')||q.includes('pointer: coarse')?{matches:${size.mobile},media:q,addEventListener(){},removeEventListener(){}}:media(q);
 <\/script>`;
 frame.srcdoc=html.replace('<head>','<head>'+boot);win=frame.contentWindow;
 for(let i=0;i<1200&&!win.game3d;i++)await sleep(50);assert(win.game3d,'游戏加载超时');g=win.game3d;await g.surfaceReady;
 if(size.mobile){const style=win.document.createElement('style');style.textContent=css.replaceAll(/\(pointer:\s*coarse\)/g,'(min-width:0px)');win.document.head.append(style);}
 for(let i=0;i<1200&&win.document.querySelector('#start').disabled;i++)await sleep(50);assert(!win.document.querySelector('#start').disabled,'模型预热超时');
 now=win.performance.now();render();
 for(const kind of ['shot','impact','contact','weapon']){
  const original=g.audio[kind].bind(g.audio);g.audio[kind]=(...args)=>{const event={kind,id:args[0],time:g.time,args};events.push(event);const played=original(...args);event.played=played===true;return played;};
 }

async function audioReady(){assert(await g.audio.init(),'浏览器尚未允许音效');await g.audio.materialEffects.prepare();g.audio.musicVolume=0;g.audio.sfxVolume=.15;g.audio.muted=false;g.audio.applyVolumes(true);}
function setup(c,biome='forest'){
 g.menu();win.qaSeed();g.select(c.hero,biome,c.index);win.document.querySelector('[data-attack-mode=manual]').click();g.start();win.document.querySelector('#dialog').close();
 Object.assign(g.world,{obstacles:[],patches:[],ponds:[],ice:[],fords:[],bridges:[],sites:[],roaming:[],discoveries:[],breakables:[],groundHeightAt:()=>0});
 g.world.overhead.firstHit=()=>null;
 // Only ambient spawn probes meet this boundary; all actual attacks stay inside.
 g.world.obstacles=Array.from({length:32},(_,i)=>({x:Math.sin(i*Math.PI/16)*23,z:Math.cos(i*Math.PI/16)*23,r:8}));
 Object.assign(g.player,{x:0,y:0,z:0,groundHeight:0,attack:999,inv:999,pending:0,level:1});g.hero.position.set(0,0,0);g.hero.rotation.y=0;
 // Fixture placement is a teleport; reset the camera pivot just like gameplay

 if(g.companion){g.companion.alive=false;g.companion.state='down';g.companion.reviveLeft=999;}

function spawn(role='golem',distance=2.7){
 const e=g.spawn(role,0,distance);assert(e,'静止目标创建失败');Object.assign(e,{hp:100000,maxHp:100000,speed:0,cool:999,damage:0,xp:0,height:6,size:1});activeTarget=e;
 // Spawn may move a body out of occupied ground. Aim at its accepted position,

}
function fire(){const before=g.hero.userData.shotSerial||0;g.player.attack=0;g.controls.held=true;step();g.controls.held=false;g.player.attack=999;assert(g.hero.userData.shotSerial===before+1,'一次输入未产生一次真实攻击');}
async function cleanup(){
 g.menu();g.audio.stopMusic();g.audio.stopWeapons();g.audio.stopCreatures();await sleep(45);
 assert(!g.bullets.length&&!g.riftStrikes.length&&!g.fields.length,'离场遗留弹体、裂口或法场');assert(!g.poison.pods.length&&!g.poison.clouds.length,'离场遗留毒囊或毒雾');

async function attackCase(c,{route,miss=false,material=0}={}){
 const[biome,role]=materials[material%materials.length];setup(c,biome);
 if(route){g.player.level=3;assert(takeUpgrade(g.player,'path:'+route),'无法合法领取路线第一阶');assert(g.player.weaponPath.rank===1,'路线没有停留在第一阶');}
 const target=miss?null:spawn(role),expected=target?enemySurface(target.kind):null;
 initial={biome,weapon:c.id,route:route||null,player:point(g.player),target:target?{...point(target),kind:target.kind,height:target.height,size:target.size,radius:target.radius}:null,camera:point(g.camera.position),direction:point(g.adventureCamera.getRay().direction),stats:weaponStats(g.player)};
 fire();advance(1.45);
 const snapshot={weapon:c.id,route:route||null,target:target?.kind||null,surface:expected,damage:target?100000-target.hp:0,serial:g.hero.userData.shotSerial,reaction,events:events.map(e=>({kind:e.kind,id:e.id,time:+e.time.toFixed(3),played:e.played}))};

  assert(target.hp<100000,'攻击没有击中静止目标');assert(contacts.length,'命中未传递武器身份');assert(reaction,'命中没有受击姿态');
  assert(events.some(e=>e.kind==='weapon'&&e.id==='surface:'+expected&&e.played),'目标表面没有创建对应接触音');
  if(route==='grimoire_wide')assert(snapshot.reaction.duration>.3,'宽裂口丢失魔典受击表现');
 }
 await cleanup();return snapshot;
}
async function gripCase(c,{miss=false}={}){
 setup(c);const target=miss?null:spawn('mushroom');g.setView('first');render();
 assert(g.firstPerson.root.visible,'第一人称持械未显示');
 const serial=g.hero.userData.shotSerial||0;g.player.attack=0;g.controls.held=true;render();g.controls.held=false;g.player.attack=999;
 let recoil=false,gripGap=0;for(let i=0;i<95;i++){
  render();const view=g.firstPerson;recoil ||= view.contactAge<.11;
  const hand=view.hands[0],p=hand.localToWorld(hand.position.clone().set(0,.045,-.023)),anchor=view.weapon.localToWorld(view.grip.clone());gripGap=Math.max(gripGap,p.distanceTo(anchor));
  assert(view.hands.every(h=>h.position.toArray().every(Number.isFinite)),'持械姿态出现非数值');
 }
 assert(g.hero.userData.shotSerial===serial+1,'一次按键触发多次攻击');assert(gripGap<1e-6,'手掌脱离握点');
 if(target)assert(target.hp<100000,'第一人称真实攻击没有命中');else assert(!events.some(e=>e.kind==='contact'),'挥空产生接触事件');

 assert(g.firstPerson.contactAge>=.11,'接触反应未正常消退');const detail={weapon:c.id,miss,damage:target?100000-target.hp:0,recoil,gripGap};await cleanup();return detail;
}
async function runGrips(){
 const id=$('#grip-size').value;buttons(true);results.length=0;errors.length=0;publish();
 try{await load(dimensions[id]);await audioReady();for(const c of cases){await check(id+' / 第一人称命中 / '+c.id,()=>gripCase(c));await check(id+' / 第一人称挥空 / '+c.id,()=>gripCase(c,{miss:true}));}}

 errors.push(...(win?.qaErrors||[]));publish();buttons(false);$('#status').textContent=results.every(r=>r.pass)&&!errors.length?'全部 '+results.length+' 组第一人称检查通过；手机仅为尺寸模拟。':'有第一人称检查失败，请查看报告。';
}
async function check(name,fn){$('#status').textContent='检查 '+name;await sleep(0);try{results.push({name,pass:true,detail:await fn()});}catch(error){const diagnostics={initial,final:{player:point(g.player),target:point(activeTarget),hp:activeTarget?.hp,bullets:g.bullets.length},trace,events};results.push({name,pass:false,error:error.message,diagnostics});$('#diagnostic').textContent=JSON.stringify({name,error:error.message,...diagnostics},null,2);try{await cleanup();}catch{}}publish();}
async function run(id){
 buttons(true);results.length=0;errors.length=0;publish();
 try{
  await load(dimensions[id]);await audioReady();
  for(const[i,c]of cases.entries())await check(id+' / 命中 / '+c.id,()=>attackCase(c,{material:i}));
  for(const c of cases)await check(id+' / 挥空收尾 / '+c.id,()=>attackCase(c,{miss:true}));
  for(const[route,path]of Object.entries(WEAPON_PATHS))await check(id+' / 一阶路线 / '+route,()=>attackCase(cases.find(c=>c.id===path.weapon),{route}));
 }catch(error){results.push({name:'初始化',pass:false,error:error.message});}
 errors.push(...(win?.qaErrors||[]));publish();buttons(false);$('#status').textContent=results.every(r=>r.pass)&&!errors.length?'全部 '+results.length+' 组真实攻击检查通过；手机仅为尺寸模拟。':'有检查失败，请查看报告。';
}
async function preview(){
 buttons(true);try{await audioReady();setup(cases.find(c=>c.id==='harpoon'));spawn('golem');g.setView('first');g.adventureCamera.yaw=0;g.adventureCamera.pitch=-.08;render();fire();advance(.18);g.pause();render();$('#status').textContent='长叉命中后姿态已冻结。';}catch(error){$('#status').textContent=error.message;}finally{buttons(false);}
}
function gunSetup(id,route=null,rank=1){
 setup(cases.find(c=>c.id===id));
 if(route)for(let i=0;i<rank;i++){g.player.level=[3,5,8][i];assert(takeUpgrade(g.player,'path:'+route),'无法领取枪械路线 '+route+' '+(i+1));}
 initial={weapon:id,route,rank:route?rank:0,stats:weaponStats(g.player),input:'真实 game3d.step，控制器 held 输入'};
 return weaponStats(g.player);
}
const gunShots=()=>events.filter(e=>e.kind==='shot'&&e.id===g.player.weaponId);
async function rifleCadence(route=null,rank=1){

 for(let i=0;i<600&&times.length<7;i++){const serial=g.hero.userData.shotSerial||0;step();if(g.hero.userData.shotSerial!==serial){times.push(g.time);cooldowns.push(g.player.attack);}}
 g.controls.held=false;assert(times.length===7,'持续输入未发出七枪');
 const pattern=route==='rifle_rapid'?[.5,.5,2]:[1,1,1],gaps=times.slice(1).map((t,i)=>t-times[i]);
 for(let i=0;i<cooldowns.length;i++)assert(Math.abs(cooldowns[i]-pattern[i%3]/stats.rate)<1e-8,'真实射后冷却与三连节拍不符 '+JSON.stringify(cooldowns));
 for(let i=0;i<gaps.length;i++)assert(Math.abs(gaps[i]-pattern[i%3]/stats.rate)<=1/60+1e-8,'实际连续射击间隔超出一帧容差');
 if(route==='rifle_rapid')for(const i of [0,3])assert(Math.abs(times[i+3]-times[i]-3/stats.rate)<=3/60+1e-8,'三枪周期改变了平均射速');
 const result={route,rank,rate:stats.rate,times,cooldowns,gaps,expectedCycle:3/stats.rate};await cleanup();return result;
}
async function rifleInterruption(kind){
 const stats=gunSetup('rifle','rifle_rapid');g.player.attack=0;g.controls.held=true;step();assert(gunShots().length===1,'首次输入没有一枪');
 const serial=g.hero.userData.shotSerial,burst=g.player.rifleBurst,cooldown=g.player.attack,time=g.time;
 if(kind==='pause'){
  g.pause();advance(1);assert(g.time===time&&g.player.attack===cooldown,'暂停仍推进射击冷却');assert(g.hero.userData.shotSerial===serial,'暂停时仍发射');g.resume();advance(1);
 }else if(kind==='dodge'){
  g.dash();assert(g.player.dashTime>0,'真实闪避未启动');
  while(g.player.dashTime>1/60+1e-8){step();assert(g.hero.userData.shotSerial===serial,'闪避过程中发射枪弹');}

}

async function shotgunPush({route=null,boss=false,wall=false,thinWall=false,body=false,distance=2.7,narrow=false}={}){
 const stats=gunSetup('shotgun',route);let target;
 if(boss){g.spawnBoss();target=g.boss;assert(target,'真实首领生成失败');Object.assign(target,{x:0,y:0,z:distance,hp:100000,maxHp:100000,height:6,cool:999,wind:0});target.mesh.position.set(0,0,distance);activeTarget=target;}

 // The third-person camera sits half a metre over the shoulder. Aim its actual
 // centre ray through the target; yaw=0 only grazes narrow targets at x=0.
 const dx=target.x-g.player.x,dz=target.z-g.player.z;

 initial.target={...point(target),radius:target.radius??target.size*.7};initial.cameraYaw=g.adventureCamera.yaw;
 const start={x:target.x,z:target.z},radius=boss?1.6:target.size*.6;
 let blocker=null;
 if(wall){blocker={x:target.x,z:target.z+(thinWall?.62:radius+.8),r:thinWall?.12:.6,height:8};g.world.obstacles.push(blocker);}
 if(body){blocker=g.spawn('golem',target.x,target.z+1.5);assert(blocker,'推开路径上的真实敌人生成失败');Object.assign(blocker,{hp:100000,maxHp:100000,speed:0,cool:999,damage:0,xp:0,height:6,size:1});}
 let maxStagger=0,maxDisplacement=0;const path=[];
 g.player.attack=0;g.controls.held=true;
 const frames=narrow?150:45;
 for(let i=0;i<frames;i++){
  step();if(!narrow)g.controls.held=false;
  const displacement=Math.hypot(target.x-start.x,target.z-start.z);maxStagger=Math.max(maxStagger,target.stagger||0);maxDisplacement=Math.max(maxDisplacement,displacement);
  if(path.length===0||Math.abs(displacement-path.at(-1).distance)>1e-6)path.push({time:g.time,distance:displacement,stagger:target.stagger||0,hp:target.hp});
  if(blocker)assert(Math.hypot(target.x-blocker.x,target.z-blocker.z)>=radius+(wall?blocker.r:blocker.size*.6)-.002,'推开穿入墙体或另一个角色');
 }
 g.controls.held=false;assert(target.hp<100000,'测试枪弹未命中目标');
 if(distance>4)assert(100000-target.hp>=stats.damage*3-1e-6,'远距检查不足三丸命中，无法验证距离限制');
 const expectedPush=!boss&&route!=='shotgun_slug'&&distance<=3.5&&!narrow;
 if(expectedPush){assert(maxStagger>.16&&maxStagger<=.18001,'近身三丸命中没有 0.18 秒硬直');assert(maxDisplacement<=1.10001,'同枪重复推开超过 1.1 米');if(!wall&&!body)assert(Math.abs(maxDisplacement-1.1)<1e-6,'空地推开未达到 1.1 米');assert((target.stagger||0)===0,'短硬直没有消退');}
 else assert(maxDisplacement<1e-8&&maxStagger===0,'不满足条件的射击触发了推开或硬直');
 if(narrow){assert(gunShots().length===3,'窄目标跨枪检查没有完成三枪');assert(Math.abs(100000-target.hp-stats.damage*3)<1e-6,'跨枪检查必须每枪仅命中一丸');}
 const result={route,boss,wall,thinWall,body,distance,narrow,shots:gunShots().length,damage:100000-target.hp,pelletDamage:stats.damage,maxDisplacement,maxStagger,path};await cleanup();return result;
}
